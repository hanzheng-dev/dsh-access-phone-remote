<!-- ⭐ 2026-09-19 19:05 图片放大层（用户：「加个点击图片，能放大看的功能」） -->
<div id="imgView">
  <img id="imgBig" alt="">
  <button id="imgClose" aria-label="关闭">✕</button>
  <div id="imgHint">双击放大 · 双指缩放 · 拖动平移 · 点空白关闭</div>
</div>
<script>
(function () {
  var view = document.getElementById('imgView');
  var big = document.getElementById('imgBig');
  if (!view || !big) return;
  var scale = 1, tx = 0, ty = 0;      // 当前变换
  var open = false;

  function apply() {
    big.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
    view.classList.toggle('zoomed', scale > 1.02);
  }
  function reset() { scale = 1; tx = 0; ty = 0; apply(); }
  function show(src) {
    big.src = src;
    reset();
    view.classList.add('on');
    open = true;
  }
  function hide() {
    view.classList.remove('on');
    open = false;
    setTimeout(function () { if (!open) big.removeAttribute('src'); }, 200);
  }
  window.__imgView = { show: show, hide: hide };

  /* 点任意消息里的图 ⇒ 放大（用事件委托，新增的图也自动生效） */
  document.addEventListener('click', function (e) {
    if (!open) {
      var t = e.target;
      if (t && t.tagName === 'IMG' && t.id !== 'imgBig' && t.closest && !t.closest('#imgView')) {
        e.preventDefault();
        show(t.currentSrc || t.src);
      }
      return;
    }
    /* 已经打开时：点空白 / ✕ ⇒ 关闭（点图本身不关，方便拖动） */
    if (e.target === view || e.target.id === 'imgClose') { e.preventDefault(); hide(); }
  }, true);

  /* ---- 手势：单指拖 / 双指捏合 / 双击放大 ---- */
  var pts = {}, lastDist = 0, lastMid = null, moved = false, lastTap = 0;

  view.addEventListener('pointerdown', function (e) {
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    moved = false;
    view.setPointerCapture && view.setPointerCapture(e.pointerId);
  });
  view.addEventListener('pointermove', function (e) {
    if (!pts[e.pointerId]) return;
    var ids = Object.keys(pts);
    if (ids.length === 1) {
      var p = pts[e.pointerId];
      var dx = e.clientX - p.x, dy = e.clientY - p.y;
      if (scale > 1.02) { tx += dx; ty += dy; apply(); moved = true; }
      p.x = e.clientX; p.y = e.clientY;
    } else if (ids.length >= 2) {
      pts[e.pointerId] = { x: e.clientX, y: e.clientY };
      var a = pts[ids[0]], b = pts[ids[1]];
      var d = Math.hypot(a.x - b.x, a.y - b.y);
      if (lastDist) {
        var k = d / lastDist;
        scale = Math.max(1, Math.min(8, scale * k));
        apply(); moved = true;
      }
      lastDist = d;
    }
  });
  function up(e) {
    delete pts[e.pointerId];
    if (Object.keys(pts).length < 2) lastDist = 0;
    if (Object.keys(pts).length === 0) {
      /* 双击：快速点两次同一处 ⇒ 在"1x / 2.5x"之间切 */
      var now = Date.now();
      if (!moved && now - lastTap < 300) {
        if (scale > 1.02) reset(); else { scale = 2.5; tx = 0; ty = 0; apply(); }
        lastTap = 0;
      } else lastTap = now;
    }
  }
  view.addEventListener('pointerup', up);
  view.addEventListener('pointercancel', up);

  /* 桌面：滚轮缩放 */
  view.addEventListener('wheel', function (e) {
    e.preventDefault();
    scale = Math.max(1, Math.min(8, scale * (e.deltaY < 0 ? 1.15 : 0.87)));
    if (scale <= 1.02) { tx = 0; ty = 0; }
    apply();
  }, { passive: false });

  /* Esc 关闭 */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && open) hide();
  });
})();
</script>

<script>
/* ⭐⭐ 2026-09-30 op：位置页 = **站内极简导航**（地图 / 附近搜索 / 四种方式时间 / 路线分段）。
   故意写成**独立脚本块** —— 主脚本是一整块，语法错=整页白屏；这里就算出错也只死这一块。
   · 地图 = 高德 **Web 端 JS API**（key 从 /api/nav-config 拿，⛔不硬编；没网则显示兜底文案）。
   · 搜索 / 路线 = hub 的 /api/poi、/api/route（后端走高德 Web 服务，坐标一律 GCJ02）。
   · 定位 / 跳地图 App = APK 原生桥 DsNative（普通浏览器退化为 navigator.geolocation / geo:）。
   ⛔ 默认全在站内看，**不跳转**；只有「↗ 开始导航」那颗小按钮才跳高德 App。 */
(function () {
  var locEl = document.getElementById('loc');
  if (!locEl) return;

  var last = null;              // 最近一次定位 {lat,lng,acc,provider,ts,gcjLat,gcjLng}
  var historyPushed = false;
  var bound = false;

  // 地图 / 路线状态（mainView = 搜索/地图视图，navView = 全屏导航视图；同一套画图逻辑）
  var mainView = { mapId: 'loMap', msgId: 'loMapMsg', map: null, startMarker: null, endMarker: null, line: null };
  var navView  = { mapId: 'loNvMap', msgId: 'loNvMsg', map: null, startMarker: null, endMarker: null, line: null };
  var amapPromise = null;
  var ROUTE_COLOR = '#ff8a3d';   // 路线折线用**暖橙**（浅色地图上看得很清）
  var currentPoi = null;
  var routes = {};              // mode -> {ok,distance,duration,cost,steps,polyline,...}
  var curMode = 'driving';
  var navOpen = false;
  var MODES = ['driving', 'walking', 'bicycling', 'transit'];
  var MODE_ICON = { driving: '驾车', walking: '步行', bicycling: '骑行', transit: '公交' };

  function $(id) { return document.getElementById(id); }
  function APIb() { return (typeof API === 'string') ? API : ''; }
  function setStat(t, err) {
    var s = $('loStat'); if (!s) return;
    s.textContent = t || ''; s.className = err ? 'err' : '';
  }
  function fmt(n, d) { return (n == null || isNaN(n)) ? '—' : Number(n).toFixed(d == null ? 6 : d); }
  function fmtTime(ts) {
    if (!ts) return '—';
    try { return new Date(ts).toLocaleString('zh-CN', { hour12: false }); } catch (e) { return '—'; }
  }
  function providerName(p) {
    if (p === 'gps') return 'GPS 卫星';
    if (p === 'network') return '网络（基站/WiFi）';
    if (p === 'passive') return '被动';
    if (p === 'browser') return '浏览器';
    return p || '—';
  }
  function fmtDist(m) {
    if (m == null || isNaN(m)) return '';
    return m >= 1000 ? (m / 1000).toFixed(1) + ' 公里' : Math.round(m) + ' 米';
  }
  function fmtDur(s) {
    if (s == null || isNaN(s)) return '—';
    s = Math.round(s);
    if (s < 60) return '不到1分';
    var m = Math.round(s / 60);
    if (m < 60) return m + '分';
    var h = Math.floor(m / 60), mm = m % 60;
    return h + '时' + (mm ? (mm + '分') : '');
  }

  function paint() {
    if (!last) return;
    $('loPos').textContent = fmt(last.lat) + ', ' + fmt(last.lng);
    $('loWgs').textContent = fmt(last.lat) + ', ' + fmt(last.lng);
    $('loGcj').textContent = (last.gcjLat == null) ? '—' : (fmt(last.gcjLat) + ', ' + fmt(last.gcjLng));
    $('loAcc').textContent = (last.acc == null || last.acc < 0) ? '未知' : ('±' + Math.round(last.acc) + ' 米');
    $('loProv').textContent = providerName(last.provider);
    $('loTime').textContent = fmtTime(last.ts);
  }
  // 当前用于高德的 GCJ02 坐标（没有 GCJ02 就退回 WGS84，可能偏 ~500m）
  function coord() {
    if (!last) return null;
    if (last.gcjLat != null) return { lat: last.gcjLat, lng: last.gcjLng };
    return { lat: last.lat, lng: last.lng };
  }

  // ---------- 地图（高德 JS API，动态加载）----------
  function hideMsgOf(v) { var m = $(v.msgId); if (m) m.style.display = 'none'; }
  function showMsgOf(v, t) { var m = $(v.msgId); if (m) { m.style.display = 'flex'; m.textContent = t; } }
  function hideMapMsg() { hideMsgOf(mainView); }
  function showMapMsg(t) { showMsgOf(mainView, t); }
  function loadAmap() {
    if (amapPromise) return amapPromise;
    var chain = fetch(APIb() + '/api/nav-config')
      .then(function (r) { return r.json(); })
      .then(function (c) {
        if (!c || !c.ok || !c.jsKey) throw new Error('未配置地图 key');
        return new Promise(function (res, rej) {
          window._AMapSecurityConfig = { securityJsCode: c.jsSecurityCode || '' };
          var s = document.createElement('script');
          s.src = 'https://webapi.amap.com/maps?v=2.0&key=' + encodeURIComponent(c.jsKey);
          s.onload = function () { res(); };
          s.onerror = function () { rej(new Error('地图脚本加载失败')); };
          document.head.appendChild(s);
        });
      });
    amapPromise = chain.catch(function (e) { amapPromise = null; throw e; });   // 失败可重试
    return amapPromise;
  }
  function ensureView(v, center) {
    return loadAmap().then(function () {
      if (typeof AMap === 'undefined') throw new Error('AMap 未就绪');
      if (!v.map) {
        v.map = new AMap.Map(v.mapId, { zoom: 15, center: [center.lng, center.lat], viewMode: '2D', resizeEnable: true, mapStyle: 'amap://styles/whitesmoke' });
      } else {
        v.map.setCenter([center.lng, center.lat]);
      }
      hideMsgOf(v);
      return v.map;
    });
  }
  function drawStartOf(v, g) {
    if (!v.map) return;
    try {
      if (v.startMarker) v.map.remove(v.startMarker);
      v.startMarker = new AMap.Marker({ position: [g.lng, g.lat], title: '我的位置', label: { content: '我' } });
      v.map.add(v.startMarker);
    } catch (e) {}
  }
  function drawPoiOf(v, p) {
    if (!v.map) return;
    try {
      if (v.endMarker) v.map.remove(v.endMarker);
      v.endMarker = new AMap.Marker({ position: [p.lng, p.lat], title: p.name });
      v.map.add(v.endMarker);
    } catch (e) {}
  }
  function drawLineOf(v, poly) {
    if (!v.map) return;
    try {
      if (v.line) { v.map.remove(v.line); v.line = null; }
      if (poly && poly.length > 1) {
        v.line = new AMap.Polyline({
          path: poly, strokeColor: ROUTE_COLOR, strokeWeight: 6,
          strokeOpacity: 0.9, lineJoin: 'round', lineCap: 'round',
        });
        v.map.add(v.line);
      }
      var vs = [];
      if (v.startMarker) vs.push(v.startMarker);
      if (v.endMarker) vs.push(v.endMarker);
      if (v.line) vs.push(v.line);
      if (vs.length) v.map.setFitView(vs, false, [50, 50, 50, 50]);
    } catch (e) {}
  }
  function ensureMap(center) { return ensureView(mainView, center); }
  function drawStart(g) { drawStartOf(mainView, g); }
  function drawPoi(p) { drawPoiOf(mainView, p); }
  function drawLine(poly) { drawLineOf(mainView, poly); }

  // ---- 给 APK 原生桥用的回调 ----
  window.DsLoc = {
    onResult: function (o) {
      if (!o) return;
      last = o;
      paint();
      var a = (o.acc == null || o.acc < 0) ? '精度未知' : ('±' + Math.round(o.acc) + '米');
      setStat('✅ 已定位（' + providerName(o.provider) + '，' + a + '）', false);
      var g = coord();
      if (g) {
        showMapMsg('地图加载中…');
        ensureMap(g).then(function () { drawStart(g); })
          .catch(function (e) { showMapMsg('地图加载失败：' + e.message + '\n可点右下角「↗ App」用地图 App 打开'); });
      }
    },
    onError: function (msg) { setStat('⚠️ ' + (msg || '定位失败'), true); }
  };

  // ---- 定位（按需：打开页面/点按钮才定位）----
  function doLocate() {
    setStat('定位中…请稍候（首次可能要几秒）', false);
    var btn = $('loGet'); if (btn) btn.disabled = true;
    var done = function () { if (btn) btn.disabled = false; };
    if (window.DsNative && typeof window.DsNative.getLocation === 'function') {
      try { window.DsNative.getLocation(); }
      catch (e) { setStat('⚠️ 定位桥调用失败：' + e.message, true); }
      setTimeout(done, 600);   // 桥是异步的；真实结果靠 DsLoc 回调
      return;
    }
    if (navigator.geolocation) {   // 普通浏览器兜底（WebView 里不会走到这）
      navigator.geolocation.getCurrentPosition(function (p) {
        last = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy,
                 provider: 'browser', ts: p.timestamp, gcjLat: null, gcjLng: null };
        window.DsLoc.onResult(last); done();
      }, function (err) {
        setStat('⚠️ 浏览器定位失败：' + (err && err.message ? err.message : err), true); done();
      }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
    } else {
      setStat('⚠️ 定位只能在手机 App 里用（网页没有定位能力）', true); done();
    }
  }

  // ---- 复制坐标（给窗口 AI 贴）----
  function doCopy() {
    if (!last) { setStat('先点「定位」拿到坐标再复制', true); return; }
    var s = '位置 ' + fmt(last.lat) + ',' + fmt(last.lng)
      + (last.gcjLat == null ? '' : ('  GCJ02 ' + fmt(last.gcjLat) + ',' + fmt(last.gcjLng)))
      + ((last.acc == null || last.acc < 0) ? '' : ('  ±' + Math.round(last.acc) + 'm'))
      + '  来源:' + providerName(last.provider);
    var ok = false;
    try {
      var ta = document.createElement('textarea');
      ta.value = s;
      ta.style.cssText = 'position:fixed;top:-1000px;left:-1000px;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      ok = document.execCommand('copy');
      document.body.removeChild(ta);
    } catch (e) { ok = false; }
    setStat(ok ? ('已复制：' + s) : ('复制失败，请手动选中：' + s), !ok);
  }

  // ---- 用地图 App 打开当前位置（GCJ02 —— 国内地图 App 认 GCJ02）----
  function doMapApp() {
    var g = coord();
    if (!g) { setStat('先点「定位」再打开地图', true); return; }
    if (window.DsNative && typeof window.DsNative.openGeo === 'function') {
      try { window.DsNative.openGeo(String(g.lat), String(g.lng), '当前位置'); return; } catch (e) {}
    }
    try { location.href = 'geo:' + g.lat + ',' + g.lng; } catch (e) { setStat('没找到地图应用', true); }
  }

  // ---------- 附近搜索 ----------
  function doSearch() {
    var q = ($('loPoiIn') && $('loPoiIn').value ? $('loPoiIn').value : '').trim();
    if (!q) { setStat('输入要找的地方，例如「味千」', true); return; }
    var g = coord();
    if (!g) { setStat('先点「定位」拿到位置，才能搜附近', true); return; }
    setStat('搜索中…', false);
    var btn = $('loPoiGo'); if (btn) btn.disabled = true;
    fetch(APIb() + '/api/poi?q=' + encodeURIComponent(q) + '&lat=' + g.lat + '&lng=' + g.lng)
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (btn) btn.disabled = false;
        if (!j || !j.ok) { setStat('⚠️ ' + ((j && j.error) || '搜索失败'), true); renderPois([]); return; }
        renderPois(j.pois);
        setStat(j.count ? ('找到 ' + j.count + ' 个「' + q + '」，点一个看路线') : ('附近没搜到「' + q + '」'), !j.count);
      })
      .catch(function (e) { if (btn) btn.disabled = false; setStat('⚠️ 搜索失败：' + e.message, true); });
  }
  function renderPois(list) {
    var box = $('loPois'); if (!box) return;
    box.innerHTML = '';
    (list || []).forEach(function (p) {
      var d = document.createElement('div');
      d.className = 'loPoi';
      var left = document.createElement('div'); left.style.cssText = 'flex:1;min-width:0';
      var nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = p.name || '(无名)';
      var ad = document.createElement('div'); ad.className = 'ad';
      ad.textContent = (p.adname || '') + (p.address ? (' · ' + p.address) : '') + (p.tel ? (' · ' + p.tel) : '');
      left.appendChild(nm); left.appendChild(ad);
      var ds = document.createElement('div'); ds.className = 'ds';
      ds.textContent = (p.distance != null ? fmtDist(p.distance) : '');
      var nb = document.createElement('button'); nb.className = 'loPoiNav'; nb.textContent = '导航';
      nb.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var all = box.querySelectorAll('.loPoi');
        for (var i = 0; i < all.length; i++) all[i].classList.remove('on');
        d.classList.add('on');
        openNavFor(p);
      });
      d.appendChild(left); d.appendChild(ds); d.appendChild(nb);
      d.addEventListener('click', function () {
        var all = box.querySelectorAll('.loPoi');
        for (var i = 0; i < all.length; i++) all[i].classList.remove('on');
        d.classList.add('on');
        selectPoi(p);
      });
      box.appendChild(d);
    });
  }

  // ---------- 路线 ----------
  function selectPoi(p) {
    currentPoi = p;
    routes = {}; curMode = 'driving';
    $('loRoute').hidden = false;
    $('loRouteTo').textContent = p.name || '';
    $('loRouteSum').textContent = '';
    $('loSteps').innerHTML = '';
    setStepsVisible($('loSteps'), false);   // ⭐ 默认驾车 ⇒ 先收起分段列表
    paintModes();
    setStat('规划路线中…', false);
    var g = coord();
    if (g) {
      showMapMsg('地图加载中…');
      ensureMap(g).then(function () { drawStart(g); drawPoi(p); })
        .catch(function (e) { showMapMsg('地图加载失败：' + e.message); });
    }
    fetchRoutes(p);
  }
  function fetchRoutes(p) {
    var g = coord();
    if (!g) { setStat('⚠️ 没有起点坐标（先定位）', true); return; }
    var jobs = MODES.map(function (m) {
      var u = APIb() + '/api/route?mode=' + m
        + '&flat=' + g.lat + '&flng=' + g.lng
        + '&tlat=' + p.lat + '&tlng=' + p.lng;
      return fetch(u).then(function (r) { return r.json(); })
        .then(function (j) { routes[m] = j; })
        .catch(function (e) { routes[m] = { ok: false, error: e.message }; });
    });
    Promise.all(jobs).then(function () {
      paintModes();
      // 默认挑一个能走的：driving → walking → bicycling → transit
      var pick = curMode;
      if (!(routes[pick] && routes[pick].ok)) {
        for (var i = 0; i < MODES.length; i++) { if (routes[MODES[i]] && routes[MODES[i]].ok) { pick = MODES[i]; break; } }
      }
      showMode(pick);
      setStat('', false);
    });
  }
  function paintModes() {
    var btns = $('loModes').querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) {
      var m = btns[i].dataset.mode;
      var r = routes[m];
      var label = btns[i].querySelector('.t');
      if (!label) continue;
      if (!r) label.textContent = '…';
      else if (r.ok) label.textContent = fmtDur(r.duration);
      else label.textContent = '无';
      btns[i].disabled = !!(r && !r.ok);
      btns[i].classList.toggle('on', m === curMode);
    }
  }
  // ⭐⭐ 2026-09-30 op：分段指引列表**只有公交/地铁才显示**（步行/骑行/驾车地图折线已说清，
  //     列表纯遮挡）。切换方式时自动出现/收起，地图区随之变大。
  function stepsShown(m) { return m === 'transit'; }
  function setStepsVisible(el, on) { if (el) el.style.display = on ? '' : 'none'; }
  function fillSteps(stepsEl, steps) {
    steps = steps || [];
    if (!steps.length) { stepsEl.innerHTML = '<div class="loStep"><span class="ic">·</span><span class="tx">直达</span></div>'; return; }
    steps.forEach(function (s) {
      var row = document.createElement('div'); row.className = 'loStep';
      var ic = document.createElement('span'); ic.className = 'ic';
      ic.textContent = s.kind === 'bus' ? '公交' : ((s.kind === 'walk' || s.kind === 'walking') ? '步行' : (s.kind === 'bicycling' ? '骑行' : '↑'));
      var tx = document.createElement('span'); tx.className = 'tx'; tx.textContent = s.instruction || '';
      var dt = document.createElement('span'); dt.className = 'dt'; dt.textContent = (s.distance != null ? fmtDist(s.distance) : '');
      row.appendChild(ic); row.appendChild(tx); row.appendChild(dt);
      stepsEl.appendChild(row);
    });
  }
  function showMode(m) {
    curMode = m;
    var r = routes[m];
    var btns = $('loModes').querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('on', btns[i].dataset.mode === m);
    var sum = $('loRouteSum'), stepsEl = $('loSteps');
    stepsEl.innerHTML = '';
    if (!r) { sum.textContent = ''; setStepsVisible(stepsEl, false); if (navOpen) paintNav(); return; }
    if (!r.ok) { sum.textContent = '该方式没有路线：' + (r.error || ''); setStepsVisible(stepsEl, false); drawLine([]); if (navOpen) paintNav(); return; }
    var parts = ['全程 ' + fmtDist(r.distance), '约 ' + fmtDur(r.duration)];
    if (m === 'transit' && r.cost != null) parts.push('票价 ' + r.cost + ' 元');
    sum.textContent = parts.join(' · ');
    setStepsVisible(stepsEl, stepsShown(m));       // ⭐ 只有公交/地铁显示分段
    if (stepsShown(m)) fillSteps(stepsEl, r.steps);
    drawLine((r.polyline && r.polyline.length > 1) ? r.polyline : []);
    if (navOpen) paintNav();
  }

  // ---------- 全屏导航视图（点搜索结果里的「导航」进；返回退回搜索/地图视图）----------
  function openNavFor(p) {
    selectPoi(p);            // 复用：设定 currentPoi + 拉四种路线（完成后会刷新两个视图）
    openNavView();
  }
  function openNavView() {
    navOpen = true;
    var el = $('loNav'); if (el) el.classList.add('show');
    var p = currentPoi;
    var to = $('loNvTo'); if (to) to.textContent = (p && p.name) || '—';
    var sum = $('loNvSum'); if (sum) sum.textContent = '';
    var steps = $('loNvSteps'); if (steps) steps.innerHTML = '';
    setStepsVisible($('loNvSheet'), false);   // ⭐ 默认驾车 ⇒ 先收起分段列表（地图占满）
    paintNav();
    var g = coord();
    if (g) {
      showMsgOf(navView, '地图加载中…');
      ensureView(navView, g).then(function () { drawStartOf(navView, g); if (p) drawPoiOf(navView, p); })
        .catch(function (e) { showMsgOf(navView, '地图加载失败：' + e.message); });
    } else {
      showMsgOf(navView, '定位后显示地图…');
    }
  }
  function closeNavView() {
    navOpen = false;
    var el = $('loNav'); if (el) el.classList.remove('show');
    try { if (mainView.map) setTimeout(function () { mainView.map.resize(); }, 60); } catch (e) {}
  }
  function paintNavModes() {
    var box = $('loNvModes'); if (!box) return;
    var btns = box.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) {
      var m = btns[i].dataset.mode, r = routes[m], label = btns[i].querySelector('.t');
      if (label) label.textContent = !r ? '…' : (r.ok ? fmtDur(r.duration) : '无');
      btns[i].disabled = !!(r && !r.ok);
      btns[i].classList.toggle('on', m === curMode);
    }
  }
  function paintNav() {
    if (!navOpen) return;
    paintNavModes();
    var r = routes[curMode];
    var sumEl = $('loNvSum'), stepsEl = $('loNvSteps');
    if (!sumEl || !stepsEl) return;
    var sheet = $('loNvSheet');
    var showSteps = stepsShown(curMode) && !!r && r.ok;   // ⭐ 只有公交/地铁且路线可用才显示
    setStepsVisible(sheet, showSteps);
    stepsEl.innerHTML = '';
    if (!r) { sumEl.textContent = '规划路线中…'; return; }
    if (!r.ok) { sumEl.textContent = '该方式没有路线：' + (r.error || ''); drawLineOf(navView, []); return; }
    var parts = ['全程 ' + fmtDist(r.distance), '约 ' + fmtDur(r.duration)];
    if (curMode === 'transit' && r.cost != null) parts.push('票价 ' + r.cost + ' 元');
    sumEl.textContent = parts.join(' · ');
    if (showSteps) fillSteps(stepsEl, r.steps);
    drawLineOf(navView, (r.polyline && r.polyline.length > 1) ? r.polyline : []);
  }

  // ---- 开始导航（唯一会跳出本页的按钮；语音播报只有地图 App 有）----
  function startNav() {
    if (!currentPoi) { setStat('先搜一个地方、点开路线', true); return; }
    var p = currentPoi;
    if (window.DsNative && typeof window.DsNative.openNav === 'function') {
      try { window.DsNative.openNav(p.name || '', String(p.lat), String(p.lng)); return; } catch (e) {}
    }
    try { location.href = 'geo:' + p.lat + ',' + p.lng + '?q=' + encodeURIComponent(p.name || ''); }
    catch (e) { setStat('没找到地图应用', true); }
  }

  function bind() {
    if (bound) return; bound = true;
    $('loX').addEventListener('click', closeLoc);
    $('loRefresh').addEventListener('click', doLocate);
    $('loGet').addEventListener('click', doLocate);
    $('loCopy').addEventListener('click', doCopy);
    $('loMapOpen').addEventListener('click', doMapApp);
    $('loPoiGo').addEventListener('click', doSearch);
    $('loPoiIn').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); doSearch(); }
    });
    $('loNavStart').addEventListener('click', startNav);
    var btns = $('loModes').querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function (e) {
        var m = e.currentTarget.dataset.mode;
        if (routes[m] && routes[m].ok) showMode(m);
      });
    }
    // ---- 全屏导航视图 ----
    $('loNvX').addEventListener('click', closeNavView);
    $('loNvStart').addEventListener('click', startNav);
    var nb = $('loNvModes').querySelectorAll('button');
    for (var j = 0; j < nb.length; j++) {
      nb[j].addEventListener('click', function (e) {
        var m = e.currentTarget.dataset.mode;
        if (routes[m] && routes[m].ok) showMode(m);   // showMode 会顺带刷新导航视图
      });
    }
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && navOpen) closeNavView();
    });
  }

  function openLoc() {
    bind();
    try { localStorage.setItem('dshPage', 'loc'); } catch (e) {}
    locEl.classList.add('show');
    try { if (typeof syncOverlayLock === 'function') syncOverlayLock(); } catch (e) {}
    if (!historyPushed) {
      try { history.pushState({ dshLoc: 1 }, '', location.pathname); historyPushed = true; } catch (e) {}
    }
    window.__locOpen = true;
    if (mainView.map) { try { setTimeout(function () { mainView.map.resize(); }, 300); } catch (e) {} }
    else { showMapMsg('定位后显示地图…'); }
    loadAmap().catch(function (e) { showMapMsg('地图加载失败：' + e.message + '\n可点右下角「↗ App」用地图 App 打开'); });
    doLocate();   // 打开即定位一次（拿到就收工，不常驻）
  }
  function closeLocNow() {
    navOpen = false;
    var nv = $('loNav'); if (nv) nv.classList.remove('show');
    historyPushed = false;
    window.__locOpen = false;
    locEl.classList.remove('show');
    try { if (typeof syncOverlayLock === 'function') syncOverlayLock(); } catch (e) {}
    try { localStorage.removeItem('dshPage'); } catch (e) {}
  }
  function closeLoc() {
    // ⚠️ suppressPop：自己发的 back() 别让主脚本 popstate 再处理一遍（照 closeLedger 老规矩）
    if (historyPushed) { historyPushed = false; try { suppressPop = true; } catch (e) {} try { history.back(); } catch (e) {} }
    closeLocNow();
  }

  window.openLoc = openLoc;
  window.__closeLocNow = closeLocNow;   // 给主脚本 popstate 用
})();
</script>
</body>
</html>
