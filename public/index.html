<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<!-- ★ 页面版本：服务端吐 HTML 时把下面这个 __DSJ_VER__ 换成 index.html 的 mtime+大小。
     放 <meta> 里、页面从 DOM 读 —— 因为服务端是**全局替换**，哨兵写在 JS 里会被一起换掉
     （判断里的哨兵被换成真版本号 ⇒ 判断恒为 false ⇒ 永不重载）。 -->
<meta name="app-ver" content="__DSJ_VER__">
<title>dsj-open</title>
<script>
  // ★ 尽早恢复主题（必须是 <head> 里第一个脚本）：
  //   放到下面那个大脚本里就太晚了 —— 页面会先按浅色画一遍再切深色，**闪一下白**。
  try { if (localStorage.getItem('dsh_theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
</script>
<style>
  :root{
    /* 浅色配色：**白底 + 黑字**（暖调），深色那套在下面 html.dark 覆盖。 */
    --bg:#ffffff;
    --panel:rgba(255,255,255,.86);      /* 面板半透，让背景图透出来一点 */
    --panel-solid:#ffffff;
    --line:rgba(0,0,0,.13);
    --line-hi:rgba(0,0,0,.30);
    --fg:#141414;                        /* 正文黑 */
    --dim:#6b6b6b;                       /* 次要信息（图标、时间戳） */
    --mid:#3d3d3d;
    --ok:#1f8a4c;
    --err:#b4322f;
  }
  /* ★ 背景层：原本是一张私有背景图（26% 透明）。
     开源版不带那张图 ⇒ 改成纯色打底，保留同一层结构（以后想放自己的图，
     把 background 换成 url(...) 即可）。 */
  body::before{
    content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:#faf8f3;
  }

  /* ═══════════════════════════════════════════════════════════════════
     ★★ 2026-09-17 深色模式（用户：「右边加个深色模式?这样我还能选择，
        现在白色有点怪怪的，毕竟是按照那个图设计的」）
     做法：`html.dark` 一套覆盖 —— 变量 + 那些**写死颜色**的规则。
     ⚠️ 为什么不能只覆盖变量：今天为了白底把 35 处写死的深色值逐个换成了浅色，
        它们不跟着变量走 ⇒ 深色模式必须**逐条覆盖回来**。
     ⚠️ 新增样式时**两边都要给**（浅色写在上面、深色写在这里），否则切过去会露馅。
     ═══════════════════════════════════════════════════════════════════ */
  html.dark{
    --bg:#111111;
    --panel:rgba(26,26,26,.88);
    --panel-solid:#1e1e1e;
    --line:rgba(255,255,255,.16);
    --line-hi:rgba(255,255,255,.32);
    --fg:#f0f0f0;
    --dim:#8a8a8a;
    --mid:#cccccc;
    --ok:#5fbf7f;
    --err:#c96a6a;
  }
  /* ⚠️ 深色下背景层要**压淡** —— 那张 bg.jpg 现在是纯白，铺在 #111 上会把深色洗成灰
     （实测：26% 白 ⇒ 背景从 rgb(17) 变成 rgb(79)）。深色下压到 8%，只留一点质感。 */
  /* ⚠️ 必须给 html 也上底色 —— 浅色时给 html 设了 #fff（让 body 透明后有个底），
     深色块里忘了覆盖 ⇒ **外面主页永远白底**（用户 2026-09-17 一眼看出来）。 */
  html.dark{ background:#111111 }
  html.dark body::before{ background-color:#111;opacity:.08 }
  /* 主页按钮 —— ⭐ 2026-09-22 op：深色下也是**扁平一块**（原来是 180° 渐变 + 描边） */
  html.dark .btn{ background:#1f1f1f }
  html.dark .btn:active{ background:#2a2a2a }
  /* ⭐ 2026-09-22 晚：第一页抽屉风（深色）—— 格子比背景亮一档 */
  html.dark #app .btn{ background:#1c1c1c }
  html.dark #app .btn:active{ background:#262626 }
  html.dark #app .btn.warn{ background:rgba(255,120,120,.10) }
  html.dark #app .btn.warn:active{ background:rgba(255,120,120,.17) }
  html.dark .btn.warn{ background:rgba(255,120,120,.12) }
  html.dark .btn.warn:active{ background:rgba(255,120,120,.19) }
  /* 2026-09-19：🍶 酒馆面板里"关闭X"状态的**警示色**（一眼能看出正在跑） */
  html.dark .btn.danger{ background:rgba(200,80,70,.30);color:#ffc9c9 }
  html.dark .btn.danger:active{ background:rgba(200,80,70,.42) }
  /* 正文 / 消息 */
  /* ★★ 2026-09-20 02:42 用户要"拿坡里黄"（那不勒斯黄）。
     ⚠️ 深色下用**柔和的奶油黄**（不刺眼）：
        第 1 版 `#F2D06B` 用户说"**太黄了**" ⇒ 降到 `#E4D6A8`（米黄/奶油，
        饱和度砍掉一半，还是暖调，但不像荧光）。
     ⚠️ 这条优先级（html.dark）**高于** 671 行那条 ⇒ 深色模式下生效的是它。 */
  html.dark .bub.pc b{ color:#E4D6A8 }
  html.dark .msgfold details{ background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.13) }
  html.dark .msgfold summary{ color:#a8a8a8 }
  html.dark .msgfold .fbody{ color:#e0e0e0;border-top-color:rgba(255,255,255,.13) }
  html.dark .bub.pc code{ background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.13) }
  html.dark .bub.pc th{ background:rgba(255,255,255,.07) }
  html.dark .bub.pc a{ color:#6ea8fe;border-bottom-color:#35507a }
  html.dark .bub.pc pre{ background:rgba(255,255,255,.05) }
  html.dark .bub.pc .mdblock{ background:rgba(255,255,255,.05) }
  html.dark .bub.me{ background:rgba(24,36,48,.62);color:#cfe0f5 }
  html.dark .bub.sys{ color:#666 }
  /* 折叠块 */
  html.dark .foldwrap details.fold{ background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.13) }
  html.dark .foldwrap summary{ color:#9a9a9a }
  html.dark .foldwrap summary::before{ color:#555 }
  html.dark .foldwrap .foldbody{ color:#9a9a9a }
  html.dark .foldwrap.reasoning details.fold{ background:rgba(56,86,150,.20);border-color:rgba(120,160,220,.32) }
  html.dark .foldwrap.reasoning .foldbody{ color:#8ba0c4 }
  html.dark .foldwrap.tool details.fold{ background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.11) }
  html.dark .foldwrap.tool summary{ color:#8f8f8f }
  html.dark .foldwrap.tool .foldbody{ color:#a8a8a8 }
  html.dark .foldimg{ background:rgba(255,255,255,.6) }
  /* 会话选择器 */
  html.dark .sessrow{ background:linear-gradient(180deg,#222,#1c1c1c) }
  html.dark .sessrow:active{ background:#2b2b2b }
  html.dark .sessrow.cur{ border-color:#3f7a52;background:linear-gradient(180deg,#1e2f24,#182420) }
  html.dark .sessrow-d{ color:#6a6a6a }
  /* 输入框 / 消息里的按钮 */
  html.dark #chIn{ background:#1e1e1e }
  /* ★ 思考档位按钮 —— ⭐ 2026-09-22 晚 用户：「ds会话和op会话的对话框和旁边的聪明程度大小不一样！
     让对话框这一行统一大小，只不过颜色别变」⇒ 尺寸对齐 op 那套（42 高 / 10 圆角 / 14px 字，
     和「发送」同规格）；**颜色/边框色一律不动**（浅色 rgba(0,0,0,.18)+#555，深色见下面 124 行）。 */
  #chEffort{ height:42px; padding:0 10px; font-size:14px; border-radius:10px;
             background:transparent; border:1px solid rgba(0,0,0,.18); color:#555; cursor:pointer }
  #chEffort[data-v="max"]{ border-color:rgba(120,90,220,.55); color:#5b46c8; font-weight:600 }
  #chEffort[data-v="high"]{ border-color:rgba(120,90,220,.35); color:#6b5ad0 }
  #chEffort[data-v="off"]{ opacity:.62 }
  html.dark #chEffort{ border-color:rgba(255,255,255,.22); color:#bbb }
  html.dark #chEffort[data-v="max"]{ border-color:rgba(150,130,255,.6); color:#b9a8ff }
  html.dark .actrow button{ background:#2f2f2f;border-color:rgba(255,255,255,.32) }
  html.dark .actrow button:active{ background:#3a3a3a }
  html.dark .actrow button.warn{ background:#3a2020;border-color:#7a4040;color:#ffc9c9 }
  html.dark .actrow button.done-ok{ background:#1e3a26;border-color:#3f7a52;color:#9fe6b4 }
  html.dark .actrow button.done-bad{ background:#3a1e1e;border-color:#7a3f3f;color:#ffb3b3 }
  /* 对话框 */
  html.dark .dlg{ background:#1a1a1a }
  html.dark .dlg-x{ background:#2f2f2f }
  html.dark .mask{ background:rgba(0,0,0,.72) }
  html.dark .badge{ background:#c0392b }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  html{background:#fff}
  body{
    /* ★ 必须 transparent —— body 要是给自己刷不透明白底，
       会把 z-index:-1 的 body::before（背景图那一层）整个盖住（今天真踩了） */
    background:transparent;color:var(--fg);
    font:15px/1.5 -apple-system,system-ui,"Noto Sans SC",sans-serif;
    /* ⭐ 2026-09-22 晚：主页 padding（安全区+左右边距）**挪进 #home 了** ——
       body 现在只剩全屏层（#chat/#relay/#ledger 都是 fixed），自己不再滚动、也不需要边距。 */
    overscroll-behavior:none;
  }

  /* ---- 主页（开源版：直接就是主页面，不再是抽屉）---- */
  #home{
    min-height:100%;
    padding:env(safe-area-inset-top) 14px calc(20px + env(safe-area-inset-bottom));
    background:transparent;
  }

  /* ---- 顶栏 ---- */
  header{
    display:flex;align-items:center;gap:10px;
    padding:16px 2px 14px;
  }
  header h1{
    font-size:17px;font-weight:600;letter-spacing:.06em;margin:0;flex:none;
  }
  /* ⭐ 2026-09-23 用户当场定的：代理点**紧跟 DSH 右侧一点点**（不是甩到「已连接」左边）⇒
     h1 不再 flex:1，改让 `.st` 自己吃剩余空间、把「已连接」和右侧图标顶到最右。 */
  header .st{margin-left:auto}
  /* ★ 主页头部的深色/浅色开关 —— 尺寸线宽跟对话页那几个图标保持一致 */
  header #themeBtn{
    background:none;border:0;padding:0;margin:0;flex:none;color:var(--dim);
    width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    font-family:inherit;line-height:1;
  }
  header #themeBtn svg{display:block;width:21px;height:21px}
  header #themeBtn:active{color:var(--fg)}
  .dot{
    width:8px;height:8px;border-radius:50%;
    border:1px solid var(--line-hi);background:#333;
    flex:none;transition:background .3s,border-color .3s;
  }
  .dot.on{background:var(--ok);border-color:var(--ok)}
  .dot.off{background:var(--err);border-color:var(--err)}
  .st{font-size:12px;color:var(--dim);letter-spacing:.04em}

  /* ---- 分组 ---- */
  .sec{margin-top:26px}
  .sec-t{
    font-size:12px;color:var(--dim);letter-spacing:.14em;
    padding:0 2px 10px;text-transform:uppercase;
    /* ⭐ 2026-09-22 晚：标题右侧拖一条细线 —— 板块边界一眼可见（纯线条，仍是平面） */
    display:flex;align-items:center;gap:10px;
  }
  .sec-t::after{content:'';flex:1;height:1px;background:var(--line)}

  /* ---- 按钮网格 ---- */
  /* ⭐ 2026-09-22 晚：两列 → **三列**（抽屉风，一屏能看 33 项，原来只能看 16 项） */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .grid.one{grid-template-columns:1fr}

  /* ⭐⭐ 2026-09-22 op：**第一页按钮全面改扁平**（用户：「第一页四个板块全是立体按钮，太丑了」）
     病根：原来是 `linear-gradient` 渐变 + 1px 描边 + `box-shadow`（还有 inset 高光）
           ⇒ 一套"立体拟物"，和会话页/账本页（平面、无描边、无投影）完全不一套。
     做法（照账本那三个控件的成法）：
       · 底色换成**一块浅灰平面**（浅色 #f4f4f2 / 深色 #1f1f1f）
       · 描边一律 `transparent`（**不是 border:none** —— 保住盒模型，按钮尺寸不位移）
       · 渐变/投影全去；圆角统一 12px；按下只变底色 + 轻微缩放（不再变描边）
     ⭐⭐ 2026-09-22 晚 第二版（用户：「第一页里面排版，按钮什么的变一下，还是平面，反正现在不太喜欢」）
     ⇒ 第一页（`#app` 作用域）改**三列抽屉风**（手机 App 主屏那种）：
       · 按钮**无底色**、竖排（emoji 上 / 文字下、居中）—— 整页 = 白底 + 图标网格，最轻的平面
       · 按下才浮出一块浅灰（`:active`）—— 平时干净，点了有反馈
       · 徽章（"新"）绝对定位到格子右上角（原来挤在文字后面）
       · 危险按钮（清除/出门/重启hub）仍留淡红底，否则看不出警示
       · ⚠️ 只改 `#app .btn` —— 对话框/账本/酒馆的 `.btn` 保持老样（那几处是横排灰块）
       · ⚠️ `#app .btn`（ID 权重）压得住 `html.dark .btn` ⇒ 深色覆盖必须带 `#app` 前缀 */
  .btn{
    -webkit-appearance:none;appearance:none;
    background:#f4f4f2;
    border:1px solid transparent;
    border-radius:12px;
    color:var(--fg);
    padding:16px 13px;
    font:inherit;font-size:14.5px;
    text-align:left;
    display:flex;align-items:center;gap:9px;
    box-shadow:none;
    transition:background .12s,transform .06s;
  }
  .btn:active{background:#e9e9e6;transform:scale(.99)}
  .btn .ico{font-size:18px;flex:none;line-height:1}
  .btn .tx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 无图标时（开源版去掉了 emoji）—— 文字居中、稍大，撑起视觉重心 */
  .btn.no-ico{justify-content:center}
  .btn.no-ico .tx{flex:none;text-align:center;font-size:15px;font-weight:500;letter-spacing:.01em}
  .btn.warn{background:rgba(180,50,47,.09)}
  .btn.warn:active{background:rgba(180,50,47,.15)}
  /* 2026-09-19：🍶 酒馆面板里"关闭X"状态的**警示色**（红底白字，手机上一眼看出正在跑） */
  .btn.danger{background:#ffd9d4;color:#a02820;font-weight:600}
  .btn.danger:active{background:#ffc7c0}
  .btn[disabled]{opacity:.42}

  /* ---- 第一页专用：三列抽屉风（覆盖上面 .btn 基类）---- */
  #app .btn{
    position:relative;
    background:#f6f6f4;
    border-radius:10px;
    padding:11px 6px 10px;
    font-size:12px;
    text-align:center;
    flex-direction:column;justify-content:center;gap:5px;
  }
  #app .btn:active{background:#eaeae8;transform:scale(.97)}
  #app .btn .ico{font-size:23px}
  #app .btn .tx{flex:none;width:100%;text-align:center}
  #app .btn .badge{position:absolute;top:5px;right:6px;margin:0}
  #app .btn.warn{background:rgba(180,50,47,.06)}
  #app .btn.warn:active{background:rgba(180,50,47,.13)}
  .btn.warn{background:rgba(180,50,47,.09)}
  .btn.warn:active{background:rgba(180,50,47,.15)}
  /* 2026-09-19：🍶 酒馆面板里"关闭X"状态的**警示色**（红底白字，手机上一眼看出正在跑） */
  .btn.danger{background:#ffd9d4;color:#a02820;font-weight:600}
  .btn.danger:active{background:#ffc7c0}
  .btn[disabled]{opacity:.42}

  /* ⭐ 2026-09-23 用户定：开关按钮（🖥️屏幕/🍺酒馆/🚀UU远程）**统一** ——
     开=白、关=黑（原先是"浅灰 vs 深灰 / 黑 vs 更黑"，对比不够、不符合直觉）。
     深浅两主题用同一套色，一眼就懂（开=亮、关=暗）。
     ⚠️ #app .btn 带 ID 权重压得住 html.dark .btn ⇒ 深色覆盖也要带 #app 前缀。 */
  #app .btn.toggle-on{background:#ffffff;color:#3a3a3a;border-color:rgba(0,0,0,.10)}
  #app .btn.toggle-on:active{background:#f1f1f1}
  #app .btn.toggle-off{background:#1b1b1b;color:#bdbdbd;border-color:rgba(255,255,255,.10)}
  #app .btn.toggle-off:active{background:#2a2a2a}
  html.dark #app .btn.toggle-on{background:#ffffff;color:#3a3a3a;border-color:transparent}
  html.dark #app .btn.toggle-on:active{background:#f1f1f1}
  html.dark #app .btn.toggle-off{background:#1b1b1b;color:#bdbdbd;border-color:rgba(255,255,255,.10)}
  html.dark #app .btn.toggle-off:active{background:#2a2a2a}

  /* ---- 结果弹窗 ---- */
  .mask{
    position:fixed;inset:0;background:rgba(0,0,0,.42);
    display:none;align-items:center;justify-content:center;
    padding:20px;z-index:80;backdrop-filter:blur(2px);
  }
  .mask.show{display:flex}
  .dlg{
    background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;
    width:100%;max-width:460px;max-height:80vh;display:flex;flex-direction:column;
    animation:pop .16s ease-out;
  }
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
  .dlg-h{
    padding:15px 18px;border-bottom:1px solid var(--line);
    font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;
  }
  .dlg-h .x{
    margin-left:auto;color:var(--dim);font-size:19px;line-height:1;
    padding:0 4px;background:none;border:0;font-family:inherit;
  }
  .dlg-b{
    padding:16px 18px;overflow:auto;white-space:pre-wrap;word-break:break-word;
    font-size:13.5px;line-height:1.72;color:var(--mid);
    -webkit-user-select:text;user-select:text;
  }
  .dlg-b img{width:100%;border-radius:8px;border:1px solid var(--line);margin-top:6px}
  .dlg-f{padding:12px 18px 16px;display:flex;gap:10px}
  .dlg-f .btn{flex:1;justify-content:center;text-align:center}

  .busy{color:var(--dim);font-size:13px}

  /* ---- ⭐ PDF 附件（手机端）----
     2026-09-19 23:02 用户：「pdf看不了，还是白色的」
     根因：**Android Chrome 不支持内嵌 PDF**（<embed type=application/pdf> 永远白屏）
     ⇒ 手机端改成两个**跟站内 .btn 同款**的按钮（别自创样式，上次 op 就是栽在样式失衡上）。
     ⚠️ 观感要跟消息里的按钮一致：圆角 11px、浅灰渐变、细边框、字 14.5px。 */
  .pdffile{display:flex;flex-direction:column;gap:8px;margin:6px 0}
  .pdffile-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 14px;border-radius:11px;border:1px solid var(--line);
    background:linear-gradient(180deg,#ffffff,#f1f1f1);
    color:var(--fg);font-size:14.5px;text-decoration:none;
    box-shadow:0 1px 2px rgba(0,0,0,.06);
  }
  .pdffile-btn:active{background:#e6e6e6;border-color:var(--line-hi)}
  html.dark .pdffile-btn{background:linear-gradient(180deg,#262626,#1e1e1e);border-color:rgba(255,255,255,.16)}
  html.dark .pdffile-btn:active{background:#2e2e2e}

  /* ---- ⭐ 图片放大层（2026-09-19 19:05 用户：「加个点击图片，能放大看的功能」）----

     所以要看"我这边还有没有流在跑"（见下面 setSendBusy / SSE 的 new+end 配对）。 */
  /* 生成中：按钮变成「停」（用户 2026-09-17 要的）—— 它不再禁用、也不再只是变淡，
     而是**换成另一个动作**：点它就去中断我。红色也按用户"纯度调低"的口味调过。 */
  .ch-f button.stop{
    background:linear-gradient(180deg,#a86a6a,#8f5a5a);
    border-color:#b87d7d;color:#fff;opacity:1;
  }
  html.dark .ch-f button.stop{ background:linear-gradient(180deg,#6d3d3d,#5a3232);border-color:#7f4a4a }
  /* 「⏹」独立按钮：窄一点，别跟发送抢位置。
     ⭐ 2026-09-22 晚：字号 15→14（跟 op 那套统一；尺寸/颜色都不动） */
  .ch-f #chStop{ padding:0 12px;font-size:14px;background:linear-gradient(180deg,#a86a6a,#8f5a5a);
    border-color:#b87d7d;color:#fff }
  html.dark .ch-f #chStop{ background:linear-gradient(180deg,#6d3d3d,#5a3232);border-color:#7f4a4a }
  html.dark .ch-f button.busy{background:linear-gradient(180deg,#3c3c3c,#303030);border-color:#4c4c4c;color:#9a9a9a}
  .badge{
    display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;
    background:#c0392b;color:#fff;font-size:11px;text-align:center;padding:0 5px;margin-left:6px;
    vertical-align:middle;
  }

  /* ---- 气泡里的交互按钮（2026-09-17 加：push.js --btn）---- */
  /* ★ 2026-09-17 用户要的：给 agent（op）的汇报加一个「直接回话」输入框 */
  .agentrow{ display:flex;gap:7px;margin-top:9px;align-items:center }
  .agentrow input{
    flex:1;min-width:0;height:36px;border-radius:9px;border:1px solid var(--line);
    background:rgba(255,255,255,.72);padding:0 11px;font:inherit;font-size:13.5px;color:var(--fg);
  }
  .agentrow input:focus{ outline:none;border-color:var(--line-hi) }
  .agentrow button{
    flex:none;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line-hi);
    background:rgba(232,232,232,.85);font:inherit;font-size:13.5px;color:var(--fg);
  }
  .agentrow button:disabled{ opacity:.5 }
  html.dark .agentrow input{ background:rgba(255,255,255,.10) }
  html.dark .agentrow button{ background:rgba(255,255,255,.14) }
  
  .actrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
  /* ★★ 2026-09-17 用户要的：**选项卡** —— 以前 QQ 只能发纯文本，选项只能用「A. xxx」土办法 */
  .optwrap{ display:flex;flex-direction:column;gap:6px;margin-top:10px }
  .optwrap .opthint{ font-size:11.5px;color:var(--dim);margin-bottom:1px;letter-spacing:.03em }
  .optwrap button{
    text-align:left;padding:10px 13px;border-radius:9px;font:inherit;font-size:13.5px;
    background:rgba(232,232,232,.58);border:1px solid var(--line);color:var(--fg);
    display:flex;align-items:center;gap:9px;line-height:1.45;
  }
  .optwrap button .k{
    flex:none;width:20px;height:20px;border-radius:5px;border:1px solid var(--line-hi);
    display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--dim);
  }
  .optwrap button:active{ background:rgba(216,216,216,.7) }
  .optwrap button.picked{
    background:rgba(210,232,214,.72);border-color:#5f9c72;color:#1d5330;
  }
  .optwrap button.picked .k{ background:#5f9c72;border-color:#5f9c72;color:#fff }
  .optwrap button.notpicked{ opacity:.42 }
  html.dark .optwrap button{ background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16) }
  html.dark .optwrap button:active{ background:rgba(255,255,255,.12) }
  html.dark .optwrap button.picked{ background:rgba(40,80,52,.55);border-color:#4f8a64;color:#bfe8cc }
  html.dark .optwrap button.notpicked{ opacity:.35 }
  /* ★★ 2026-09-29：**问用户选择框**（ask_user_question 的 UI）——
     和选项卡长得像，但语义不同。 */
  .askwrap{ display:flex;flex-direction:column;gap:14px;margin-top:10px }
  .askwrap .askq{ display:flex;flex-direction:column;gap:6px }
  .askwrap .askhd{ font-size:11.5px;color:var(--dim);letter-spacing:.04em;text-transform:none }
  .askwrap .asktitle{ font-size:14px;font-weight:600;line-height:1.5 }
  .askwrap .askopt{
    text-align:left;padding:11px 13px;border-radius:9px;font:inherit;font-size:13.5px;
    background:rgba(232,232,232,.58);border:1px solid var(--line);color:var(--fg);
    display:flex;flex-direction:column;gap:2px;line-height:1.4;
  }
  .askwrap .askopt .lb{ display:flex;align-items:center;gap:9px }
  .askwrap .askopt .k{
    flex:none;width:20px;height:20px;border-radius:5px;border:1px solid var(--line-hi);
    display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--dim);
  }
  .askwrap .askopt .desc{ font-size:11.5px;color:var(--dim);padding-left:29px;line-height:1.45 }
  .askwrap .askopt:active{ background:rgba(216,216,216,.7) }
  .askwrap .askopt.picked{ background:rgba(210,232,214,.72);border-color:#5f9c72;color:#1d5330 }
  .askwrap .askopt.picked .k{ background:#5f9c72;border-color:#5f9c72;color:#fff }
  .askwrap .askopt.picked .desc{ color:#3d6b4c }
  .askwrap button.askcommit{
    justify-content:center;font-weight:600;text-align:center;padding:11px 13px;border-radius:9px;font:inherit;font-size:13.5px;
    background:var(--accent,#ffe2c0);border:1px solid var(--line);color:#5a3d18;
  }
  .askwrap button[disabled]{ opacity:.5 }
  .askwrap .askdone{ font-size:13px;color:#1f7a45;font-weight:600;margin-top:2px }
  html.dark .askwrap .askopt{ background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16) }
  html.dark .askwrap .askopt:active{ background:rgba(255,255,255,.12) }
  html.dark .askwrap .askopt.picked{ background:rgba(40,80,52,.55);border-color:#4f8a64;color:#bfe8cc }
  html.dark .askwrap .askopt.picked .desc{ color:#8fc9a2 }
  html.dark .askwrap button.askcommit{ background:rgba(255,226,192,.85);color:#3a2708 }
  .actrow button{
    -webkit-appearance:none;appearance:none;font:inherit;font-size:13px;
    background:rgba(232,232,232,.58);color:var(--fg);border:1px solid var(--line-hi);
    border-radius:8px;padding:7px 12px;
  }
  .actrow button:active{background:#dcdcdc}
  .actrow button.warn{background:rgba(255,241,241,.58);border-color:#e3b6b6;color:#b4322f}
  /* 按过之后的样子（用户 10:47 的思路：变绿打勾 / 变红打叉，不注入消息） */
  .actrow button.done-ok{background:rgba(230,247,236,.58);border-color:#3f7a52;color:#1f7a45}
  .actrow button.done-bad{background:rgba(253,234,234,.58);border-color:#c0392b;color:#b4322f}
  .actrow button[data-done]{pointer-events:none}

  /* ---- 逐字流光标：还在蹦字时尾巴闪一下 ---- */
  .bub.streaming .txt::after{content:'▍';color:#7aa2ff;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}

  /* ---- 底部提示 ---- */
  footer{
    margin-top:26px;padding-top:14px;border-top:1px solid #1c1c1c;
    font-size:11.5px;color:#888;letter-spacing:.03em;text-align:center;
  }

  /* ---- ⭐⭐ 2026-09-30 op：位置页 = 站内极简导航（地图 + 附近搜索 + 四种方式时间/路线）----
     独立全屏层（照 #ledger 那套：自己那条 history + 刷新后还原），z-index 72 盖最上。
     ⛔ 默认全在站内看，不跳转；只有「↗ 开始导航」那颗小按钮才跳地图 App（语音播报只有 App 有）。 */
  #loc{ position:fixed;inset:0;z-index:72;display:none;flex-direction:column;
    background:#f7f5ef;color:var(--fg);
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  #loc.show{display:flex}
  /* ⭐⭐ 2026-09-30 op：位置页**强制浅色暖调**（照抄 #ledger 那套，2026-09-21 用户定的）：
     底 #f7f5ef（暖白）/ 卡片 #fffefb / 抬头 #efece3 / 字深暖灰；强调米金 #E4D6A8 + 浅橘 #ffe2c0。
     深色主题下也照样暖白（跟账本一致），⛔ 只在 #loc / #loNav 作用域内覆盖，不动全局 html.dark。 */
  #loc, html.dark #loc, #loNav, html.dark #loNav{
    --fg:#3a382f; --mid:#6b675c; --dim:#8f8a7d;
    --line:rgba(58,56,47,.14); --line-hi:rgba(58,56,47,.28);
    --panel:#fffefb; --panel-solid:#fffefb; --bg:#f7f5ef;
    color:var(--fg); color-scheme:light;
  }
  html.dark #loc, html.dark #loNav{ background:#f7f5ef }
  #loBar{flex:none;display:flex;align-items:center;gap:6px;
    padding:10px 14px;border-bottom:1px solid var(--line);background:#efece3}
  #loBar b{font-size:15px;font-weight:600;flex:1}
  #loBar button{background:none;border:0;color:var(--dim);padding:0;flex:none;
    width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:19px}
  #loBar button svg{display:block;width:21px;height:21px}
  #loBar button:active{color:var(--fg)}
  #loBody{flex:1;overflow-y:auto;padding:12px 14px 28px;-webkit-overflow-scrolling:touch}
  /* 地图 */
  #loMapBox{position:relative;height:38vh;min-height:190px;border-radius:14px;overflow:hidden;
    border:1px solid var(--line);background:var(--panel);margin-bottom:10px}
  #loMap{position:absolute;inset:0}
  #loMapMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:13px;color:var(--dim);text-align:center;padding:16px;pointer-events:none}
  #loMapOpen{position:absolute;right:8px;bottom:8px;z-index:3;font:inherit;font-size:12px;
    padding:7px 11px;border-radius:20px;border:1px solid var(--line-hi);
    background:var(--panel-solid);color:var(--fg);box-shadow:0 2px 8px rgba(58,56,47,.18)}
  #loMapOpen:active{opacity:.7}
  /* 搜索 */
  #loSearchRow{display:flex;gap:8px;margin-bottom:8px}
  #loPoiIn{flex:1;min-width:0;font:inherit;font-size:15px;padding:11px 12px;border-radius:12px;
    border:1px solid var(--line-hi);background:var(--panel-solid);color:var(--fg)}
  #loPoiGo{font:inherit;font-size:15px;padding:11px 18px;border-radius:12px;border:1px solid transparent;
    background:#ffe2c0;color:#3a382f;font-weight:600}
  html.dark #loPoiGo{background:#ffe2c0;color:#3a382f}
  #loPoiGo:active{background:#f7d3a6}
  #loPoiGo:disabled{opacity:.5}
  #loStat{font-size:13px;color:var(--dim);min-height:18px;margin-bottom:8px}
  #loStat.err{color:var(--err)}
  /* POI 列表 */
  #loPois:empty{display:none}
  #loPois{margin-bottom:10px}
  .loPoi{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:12px;
    border:1px solid var(--line);background:var(--panel);margin-bottom:8px}
  .loPoi:active{opacity:.75}
  .loPoi.on{border-color:#E4D6A8;background:#f4f1e9}
  html.dark .loPoi.on{border-color:#E4D6A8;background:#f4f1e9}
  .loPoi .nm{flex:1;min-width:0;font-size:14.5px;font-weight:600;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .loPoi .ad{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .loPoi .ds{flex:none;font-size:12.5px;color:#6b675c;font-weight:600;white-space:nowrap}
  html.dark .loPoi .ds{color:#6b675c}
  .loPoiNav{flex:none;font:inherit;font-size:13px;padding:8px 12px;border-radius:10px;
    border:1px solid #E4D6A8;background:#f4f1e9;color:#3a382f;font-weight:600}
  .loPoiNav:active{opacity:.7}
  html.dark .loPoiNav{border-color:#E4D6A8;background:#f4f1e9;color:#3a382f}
  /* 路线面板 */
  #loRoute{margin-bottom:12px}
  #loModes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
  #loModes button{font:inherit;font-size:12.5px;padding:9px 2px;border-radius:10px;
    border:1px solid var(--line-hi);background:var(--panel-solid);color:var(--fg);
    display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.3}
  #loModes button .t{font-size:11.5px;color:var(--dim)}
  #loModes button.on{border-color:rgba(58,56,47,.45);background:#E4D6A8;color:#3a382f;font-weight:600}
  #loModes button.on .t{color:rgba(58,56,47,.72)}
  #loModes button:disabled{opacity:.45}
  #loRouteHead{margin-bottom:8px}
  #loRouteTo{font-size:14.5px;font-weight:600;margin-bottom:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #loRouteSum{font-size:13px;color:#3a382f;font-weight:600}
  html.dark #loRouteSum{color:#3a382f}
  #loSteps{border:1px solid var(--line);border-radius:12px;background:var(--panel);
    padding:4px 0;margin-bottom:10px;max-height:38vh;overflow-y:auto}
  .loStep{display:flex;gap:10px;padding:9px 12px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.5}
  .loStep:first-child{border-top:0}
  .loStep .ic{flex:none;width:20px;text-align:center}
  .loStep .tx{flex:1;min-width:0}
  .loStep .dt{flex:none;color:var(--dim);font-size:12px;white-space:nowrap;padding-top:1px}
  #loNavStart{width:100%;font:inherit;font-size:15px;padding:12px;border-radius:12px;
    border:1px solid #E4D6A8;background:#ffe2c0;color:#3a382f;font-weight:600}
  #loNavStart:active{background:#f7d3a6}
  /* 底部按钮 / 坐标 */
  .lo-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .lo-btns button{font:inherit;font-size:15px;padding:13px 10px;border-radius:12px;
    border:1px solid var(--line-hi);background:var(--panel-solid);color:var(--fg)}
  .lo-btns button:active{opacity:.7}
  .lo-btns button.primary{border-color:#E4D6A8;background:#ffe2c0;color:#3a382f;font-weight:600}
  html.dark .lo-btns button.primary{border-color:#E4D6A8;background:#ffe2c0;color:#3a382f}
  #loCoordBox{margin-bottom:12px}
  #loCoordBox summary{font-size:13px;color:var(--dim);cursor:pointer;padding:4px 0}
  #loCard{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px;margin-top:8px}
  #loPos{font:600 16px/1.5 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;
    letter-spacing:.01em;margin-bottom:8px}
  #loMeta{font-size:12.5px;color:var(--dim);line-height:1.8}
  #loMeta .k{color:var(--mid)}
  #loHint{font-size:12px;color:var(--dim);line-height:1.7}
  /* ---- ⭐⭐ 2026-09-30 op：全屏导航视图（点搜索结果里的「导航」进）----
     地图占满中间，顶部信息条 + 底部可滚动分段指引；返回就退回搜索/地图视图。
     ⛔ 仍然不跳转，只有底部「↗ 开始导航」才跳高德 App。 */
  #loNav{position:fixed;inset:0;z-index:74;display:none;flex-direction:column;
    background:var(--bg);color:var(--fg);
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  #loNav.show{display:flex}
  #loNvBar{flex:none;display:flex;align-items:center;gap:6px;
    padding:10px 14px;border-bottom:1px solid var(--line);background:#efece3}
  #loNvBar b{font-size:15px;font-weight:600;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #loNvBar button{background:none;border:0;color:var(--dim);padding:0;flex:none;
    width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:19px}
  #loNvBar button svg{display:block;width:21px;height:21px}
  #loNvBar button:active{color:var(--fg)}
  #loNvHead{flex:none;padding:9px 14px;border-bottom:1px solid var(--line);background:#efece3}
  #loNvSum{font-size:13px;color:#3a382f;font-weight:600;min-height:18px;margin-bottom:8px}
  html.dark #loNvSum{color:#3a382f}
  #loNvModes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  #loNvModes button{font:inherit;font-size:12.5px;padding:9px 2px;border-radius:10px;
    border:1px solid var(--line-hi);background:var(--panel-solid);color:var(--fg);
    display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.3}
  #loNvModes button .t{font-size:11.5px;color:var(--dim)}
  #loNvModes button.on{border-color:rgba(58,56,47,.45);background:#E4D6A8;color:#3a382f;font-weight:600}
  #loNvModes button.on .t{color:rgba(58,56,47,.72)}
  #loNvModes button:disabled{opacity:.45}
  #loNvMapWrap{position:relative;flex:1;min-height:0}
  #loNvMap{position:absolute;inset:0}
  #loNvMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:13px;color:var(--dim);text-align:center;padding:16px;pointer-events:none}
  #loNvSheet{flex:0 1 auto;max-height:34vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    border-top:1px solid var(--line);background:var(--panel-solid);padding:4px 0}
  #loNvFoot{flex:none;padding:10px 14px;border-top:1px solid var(--line);background:#efece3}
  #loNvStart{width:100%;font:inherit;font-size:15px;padding:12px;border-radius:12px;
    border:1px solid #E4D6A8;background:#ffe2c0;color:#3a382f;font-weight:600}
  #loNvStart:active{background:#f7d3a6}

  /* ---- 上手引导 / 消息流（开源版新增）---- */
  .guide{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;margin:4px 0 10px}
  .guide-h{font-size:16px;font-weight:600;margin-bottom:8px}
  .guide-addr{font-size:13.5px;color:var(--mid);margin-bottom:10px;word-break:break-all}
  .guide-sub{font-size:12px;color:var(--dim);letter-spacing:.1em;margin-bottom:6px}
  .guide-list{list-style:none;padding:0;margin:0 0 12px;font-size:13.5px;color:var(--fg);line-height:2}
  .guide-act{display:flex;gap:8px}
  .guide-act .btn{flex:1;justify-content:center}
  .guide-line{display:flex;align-items:center;gap:8px;padding:8px 4px 2px;font-size:12.5px;color:var(--dim)}
  .guide-line .dot{flex:none}
  .guide-addr2{font-family:ui-monospace,Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .guide-line .minibtn{flex:none}
  .ch-body{max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding:6px 2px;overflow-anchor:none;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.5)}
  html.dark .ch-body{background:rgba(255,255,255,.04)}
  .ch-body:empty::after{content:'暂无消息';color:var(--dim);font-size:12.5px;padding:10px}
</style>
</head>
<body>

<!-- dsj-open 主页：顶栏（状态点 / 深浅色 / 刷新）+ 控制台（#app，按钮由 render() 按 /api/commands 生成）
     + 上手引导（#guide）+ 消息流（#chBody，接收 /api/push 推送）。 -->
<div id="home">
<header>
  <span class="dot" id="dot"></span>
  <h1>dsj-open</h1>
  <span class="st" id="st">连接中</span>
  <!-- 深色/浅色开关：图标——浅色显示月亮、深色显示太阳 -->
  <button id="themeBtn" title="切换深色/浅色" aria-label="切换深色浅色">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path class="icoMoon" d="M20.6 14.7A8.7 8.7 0 0 1 9.3 3.4a8.7 8.7 0 1 0 11.3 11.3z"/>
      <g class="icoSun" style="display:none">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.5 1.5M17.1 17.1l1.5 1.5M18.6 5.4l-1.5 1.5M6.9 17.1l-1.5 1.5"/>
      </g>

async function sendImageToDsh(file) {
  if (!file) return;
  try {
    const fd = new FormData(); fd.append('file', file);
    const r = await fetch(API + '/api/upload', { method: 'POST', body: fd });
    const j = await r.json();
    if (!j.ok) { bubble('sys', '✗ 上传失败：' + (j.error || '未知')); return; }
    const p = await fetch(API + '/api/push', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: '拍照', image: j.url, kind: 'chat' }),
    });
    if (!p.ok) bubble('sys', '✗ 推送失败');
  } catch (e) { bubble('sys', '✗ 上传失败：' + e.message); }
}

// ---------- 执行指令 ----------
async function exec(cmd) {
  const doIt = async () => {
    openDlg(cmd.label, '<span class="busy">执行中…</span>', []);
    try {
      const r = await fetch(API + '/api/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: cmd.id }),
      });
      const j = await r.json();
      let body = escapeHtml(j.text || '(无返回)')
        + (j.image ? `<img src="${API}${j.image}?t=${Date.now()}">` : '');
      openDlg((j.ok ? '' : '⚠️ ') + cmd.label, body);
    } catch (e) {
      openDlg('出错', escapeHtml(String(e)));
    }
  };
  if (cmd.confirm) {
    openDlg('确认执行', `确定要执行「${cmd.label}」吗？\n\n${cmd.desc || ''}`, [
      { label: '取消' },
      { label: '确定执行', warn: true, onClick: doIt },
    ]);
  } else {
    doIt();
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

/** 面板里的快捷动作：执行 → 显示结果 */

    const j = await r.json();

    openDlg('出错', escapeHtml(String(e)));

}

// ---------- 消息流（推送）----------

let inboxSince = 0;

let es = null;

// ---------- 上手引导（开源版新增）----------
// 服务端暂无"配置状态"接口 ⇒ 用本地标记判断：第一次进来显示完整引导，收起后变一行状态。
//
// ⭐ 2026-10-05：这套引导原本是照着「在电脑浏览器里打开」写的，搬到手机上就自相矛盾了 ——
//   标题写「手机访问：…」、清单写「手机打开上面地址试试」「装 APK」，可用户此刻**就在手机
//   （很可能就是 APK）里**。所以按设备分两套文案：电脑上说"去手机上做什么"，手机上直接说"能干什么"。
function renderGuide() {
  const box = document.getElementById('guide');
  if (!box) return;
  const addr = location.origin;
  const isPhone = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');
  let done = false;
  try { done = !!localStorage.getItem('dsj_onboard_done'); } catch (e) {}
  if (!done) {
    if (isPhone) {
      // 手机端：不重复地址（已经在用了），只告诉他能干什么
      box.innerHTML = '<div class="guide">'
        + '<div class="guide-h">已连上电脑</div>'
        + '<div class="guide-sub">可以试试：</div>'
        + '<ul class="guide-list">'
        + '<li>□ 传个文件过去，或让电脑传过来</li>'
        + '<li>□ 电脑上的脚本 / AI 能往这里推消息</li>'
        + '<li>□ 下面的按钮可以遥控电脑</li>'
        + '</ul>'
        + '<div class="guide-act">'
        + '<button class="btn" id="guideHelp"><span class="tx">帮助</span></button>'
        + '<button class="btn" id="guideOk"><span class="tx">收起</span></button>'
        + '</div>'
        + '</div>';
    } else {
      // 电脑端：他在电脑前，所以要告诉他"去手机上做什么"
      box.innerHTML = '<div class="guide">'
        + '<div class="guide-h">dsj-open 已启动</div>'
        + '<div class="guide-addr">手机访问：<b>' + escapeHtml(addr) + '</b></div>'
        + '<div class="guide-sub">下一步：</div>'
        + '<ul class="guide-list">'
        + '<li>□ 用手机扫码或打开上面地址</li>'
        + '<li>□ 配置位置功能（可选，需要高德 key）</li>'
        + '<li>□ 装 APK（可选，体验更好）</li>'
        + '</ul>'
        + '<div class="guide-act">'
        + '<button class="btn" id="guideHelp"><span class="tx">帮助</span></button>'
        + '<button class="btn" id="guideOk"><span class="tx">收起</span></button>'
        + '</div>'
        + '</div>';
    }
    const hp = document.getElementById('guideHelp');
    if (hp) hp.onclick = () => { location.href = '/pages/help.html'; };
    // ⭐ 2026-10-05 去掉手机端的「二维码」入口。
    //   理由：主流程是**电脑终端打印二维码 → 手机扫**，那才是给人扫的。
    //   手机屏幕上再放一个二维码，用户得再找第三台设备来扫它 —— 场景想不出来，
    //   还容易被误会成"这东西在联网传什么"。手机端有「复制地址」就够了。
    //   页面 /pages/qr.html 本身保留：在**电脑浏览器**里打开它是有用的
    //   （不方便看终端时），只是不再从手机首页给入口。
    const ok = document.getElementById('guideOk');
    if (ok) ok.onclick = () => { try { localStorage.setItem('dsj_onboard_done', '1'); } catch (e) {} renderGuide(); };
    return;
  }
  box.innerHTML = '<div class="guide-line"><span class="dot on"></span>'
    + '<span class="guide-addr2">' + escapeHtml(addr) + '</span>'
    + '<button class="minibtn" id="guideCopy">复制</button>'
    + '<button class="minibtn" id="guideHelp2">帮助</button></div>';
  const c = document.getElementById('guideCopy');
  if (c) c.onclick = () => { try { navigator.clipboard.writeText(addr); toast('已复制地址'); } catch (e) { toast(addr); } };
  const h2 = document.getElementById('guideHelp2');
  if (h2) h2.onclick = () => { location.href = '/pages/help.html'; };
}
// ★★ 2026-09-17 用户要的：**文件内容直接嵌进对话里，展开就能看**
//
// 原话：「你把正文写进折叠里去了，我要的是，**他汇报的txt，我能直接展开看**」
//   ⇒ 不是"把我的长回复折起来"（那个我理解错了，已撤掉），
//     而是**消息可以带一个文件**：页面上是个折叠块，展开**直接把文件内容贴出来**，
//     不用去文件管理器翻。
//
// 数据：消息对象上的 `file: { path, name, size }`（桥推消息时带上，hub 存进消息池）
//   ⚠️ **内容按需加载**（GET /api/file?path=…），**不是**一开始就把几万字塞进消息里 ——
//     否则每次拉消息都拖着它，而且我这边也白读一遍。
//
// UI 取舍（归我）：
//   · 标题 = 📄 文件名 + 大小
//   · 展开 → 内容出现在**对话里**（等宽、保留换行），不跳转、不开新窗口
//   · 懒加载 + 只加载一次
// ★★ 2026-09-17：**文件阅读** —— 按类型分流，内容**不经过我的上下文**
//   用户：「干脆扩展成文件阅读怎么样? word，txt，md这类? 比如他做完，给你注入文件，
//          直接让我看到，跟图片一样，你看我也看，**不对，你不准看**」
//
// 分流规则（决定权在我，写清取舍）：
//   · 纯文本（txt/md/json/log/csv/代码）→ `/api/file` 拿原文，**直接嵌**（等宽、保留换行）
//   · PDF                              → `<embed>` 直接嵌（浏览器自带阅读器，手机也行）
//   · Office（docx/xlsx/pptx）          → 用**桥事先转好的 PDF**（转一次几十秒，不能点开时才转）
//   ⚠️ **内容永远不经过我**：桥只传路径，页面自己去拉/去嵌。
const TEXT_EXT = /.(md|txt|json|log|csv|js|ts|html|css|ya?ml|xml|ini|sh|ps1|bat)$/i;

// ★★ 2026-09-19：**附件编辑** —— 用户要"点开就能直接改、每次保存自动备份"。
//   保存走新接口 POST /api/file/save（hub-server 负责备份+≤2MB 校验）。
function toast(msg) {
  let t = document.getElementById('fetoast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'fetoast';
    t.style.cssText = 'position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:99999;' +
      'background:rgba(20,20,20,.92);color:#fff;padding:10px 18px;border-radius:10px;' +
      'font-size:14px;max-width:82vw;word-break:break-word;box-shadow:0 4px 18px rgba(0,0,0,.3)';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  clearTimeout(t._t);
  t._t = setTimeout(() => { t.remove(); }, 2600);
}
function enterEdit(fb, path, origText) {
  if (fb._editing) return;
  fb._editing = true;
  fb._orig = origText;
  const edBar = fb.querySelector('.fileeditbar');
  if (edBar) edBar.style.display = 'none';
  const pre = fb.querySelector('.fetext');
  if (pre) pre.style.display = 'none';
  const ta = document.createElement('textarea');
  ta.className = 'feta';
  ta.value = origText;
  fb._ta = ta;
  fb.appendChild(ta);
  const row = document.createElement('div');
  row.className = 'feact';
  const saveBtn = document.createElement('button');
  saveBtn.type = 'button'; saveBtn.className = 'fed-btn primary'; saveBtn.textContent = '保存';
  const cancelBtn = document.createElement('button');
  cancelBtn.type = 'button'; cancelBtn.className = 'fed-btn'; cancelBtn.textContent = '↩️ 取消';
  row.appendChild(saveBtn); row.appendChild(cancelBtn);
  fb.appendChild(row);
  ta.focus();
  saveBtn.onclick = async () => {
    if (saveBtn.disabled) return;
    saveBtn.disabled = true; saveBtn.textContent = '保存中…';
    try {
      const rr = await fetch(API + '/api/file/save', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path, text: ta.value }),
      });
      const jj = await rr.json();
      if (jj && jj.ok) {
        if (pre) { pre.textContent = ta.value; pre.style.display = ''; }
        ta.remove(); row.remove();
        if (edBar) edBar.style.display = '';
        fb._editing = false;
        toast('已保存'); stickToBottom();
      } else {
        saveBtn.disabled = false; saveBtn.textContent = '保存';
        toast('保存失败: ' + ((jj && jj.error) || '未知'));
      }
    } catch (e) {
      saveBtn.disabled = false; saveBtn.textContent = '保存';
      toast('保存失败: ' + e.message);
    }
  };
  cancelBtn.onclick = () => {
    if (ta.value !== origText && !confirm('有未保存的改动，放弃吗？')) return;

function renderFileFold(file) {

    //      但从手机拉下来的文件**本身就可能是 PDF**（没有 `pdf` 字段）⇒ 会被漏掉。
    //      现在两种都认：有 `pdf` 字段就用它，否则用文件自己。
    //   ⚠️⚠️ 2026-09-19 22:59 用户报：「**pdf看不了，还是白色的**」

    if (/\.pdf$/i.test(nm)) {

      fb.textContent = '';

    if (/\.(png|jpe?g|gif|webp)$/i.test(nm)) {

    if (/\.(docx?|xlsx?|pptx?)$/i.test(nm)) {

    fb.textContent = '读取中…';
    try {
      const r = await fetch(API + '/api/file?path=' + encodeURIComponent(file.path), { cache: 'no-store' });
      const j = await r.json();
      if (j && j.ok) {
        // ★★ 2026-09-19：**默认仍只读展示**（保持原体验），右上角加「✏️ 编辑」→ 点了才变 textarea。
        fb.textContent = '';

      else { fb.textContent = '(读不到: ' + ((j && j.error) || '未知') + ')'; loaded = false; }
    } catch (e) {
      fb.textContent = '(读不到: ' + e.message + ')';
      loaded = false;
    }

  });

}

// ★★ 2026-09-22 op：**网页浮层卡片** —— 用户要「消息里点开一个网页小框，直接操作，不用切屏」。

// ⭐ 2026-09-23 op：**明文 URL 自动变「折叠网页卡片」** —— 用户原话：
//   「只要有链接，自动生成一个折叠的网页按钮」「不管你的还是 fht 发的，就只要有链接」
//   任何消息（AI / 用户 / fht / 系统）渲染**定稿后**扫一次正文：正文里的 http(s) 明文链接
//   ⇒ 自动生成一张跟 /api/push 的 web 卡片**一模一样**的折叠卡（复用 renderWebFold），
//     点开还是走浮层（openWebLayer），不切 App。
//   ⚠️ 幂等：重扫前先删掉自己上次加的（.autoweb）⇒ 流式收尾再扫也不会叠加。
//   ⚠️ **原文一个字不动**（卡片是额外加的）；只认明文 http(s)（抖音口令那种不做）。
function extractUrls(text) {
  const s = String(text || '');
  const out = [];
  const seen = new Set();
  // 边界：空格 / 引号 / 尖括号 / 反引号，以及中英文标点（。，、；：！？… 及成对括号引号）
  const re = /https?:\/\/[^\s<>"'`）)】\]}、。，；：！？…“”‘’「」『』【】《》〈〉]+/g;
  let m;
  while ((m = re.exec(s))) {
    // 尾部可能粘着句末标点（英文和中文都要剥）
    const u = m[0].replace(/[.,;:!?'"`)\]}>。，、；：！？…·”’】）}]+$/g, '');
    if (!u || seen.has(u)) continue;
    seen.add(u);
    out.push({ url: u, title: urlShortTitle(u) });
  }

}
// 卡片标题：优先取 URL 最后一段（比"域名上下重复两遍"好看），空则留空、让 renderWebFold 用域名兜底
function urlShortTitle(u) {
  try {
    const seg = new URL(u).pathname.replace(/\/+$/, '').split('/').filter(Boolean).pop() || '';

  } catch (e) { return ''; }
}
function autoWebCards(el, text) {
  if (!el || !el.classList) return;
  if (el._mk === 'reasoning' || el._mk === 'tool') return;   // 思考/工具是旁白，不扫
  Array.from(el.querySelectorAll('.webfold.autoweb')).forEach((n) => n.remove());
  const urls = extractUrls(text != null ? text : (el._raw || ''));
  if (!urls.length) return;
  // 已经存在的卡片（push 带的 web）按 URL 去重
  const taken = new Set();
  Array.from(el.querySelectorAll('.webfold')).forEach((n) => { if (n._url) taken.add(n._url); });
  const t = el.querySelector('.txt');
  let anchor = (t && t.parentNode === el) ? t : null;
  for (const u of urls) {
    if (taken.has(u.url)) continue;
    const card = renderWebFold({ url: u.url, title: u.title });
    card.classList.add('autoweb');
    if (anchor) { anchor.parentNode.insertBefore(card, anchor.nextSibling); anchor = card; }
    else el.appendChild(card);
  }
  stickToBottom();
}
//   ⚠️ 只标"注入/发图"这种**用户主动或电脑自动塞进来的**；AI 正常回答（chat/text）不标，避免噪音。
function srcTagFor(mkind, image, detailImage) {

  if (mkind === 'clip') return '（新注入内容）'; // 电脑剪贴板注入（clip-watch）
  if (mkind === 'tool' && detailImage) return '（新图）'; // 工具配图
  return '';
}
function bubble(kind, text, image, buttons, mkind, detail, detailImage, streaming, file, options, agent, web, ask) {
  const body = $('chBody');

  d.dataset.mkind = mk;

    d._foldImg = detailImage || '';   // 工具是"看图"时，折叠块里的配图（用户 10:47 要求）
    setFoldText(d, text || '');
    // ★★ 2026-09-17 不再直接 append —— 由 placeMsgTyped 决定
    //   挂到它**所属的那段正文**下面（工具箱）还是退回顶层（老行为）。
    //   （placeMsgTyped 会补 dataset.mid / msgKeys，这里只管把元素造好。）

  }

  d.className = 'bub ' + kind;
  // ★★ 2026-09-19：来源标签 —— 用户一眼看出这条是怎么来的（发图/剪贴板注入）。

  if (file && file.path) d.appendChild(renderFileFold(file));
  // ★★ 2026-09-22：**网页浮层卡片**（点开是原生小窗口，见 renderWebFold）

      const el = document.createElement('button');

      // ★★ 2026-09-17 用户给的思路（原话）：
      //   「按了之后，不是注入消息，而是点了，然后换按钮背景，比如变绿，然后一个勾，

// ★★ 选项卡：从一组里选一个（或多选），选完**一次**把结果回传。
//   语义 = 「我答完了」。选中项变绿 + ✓，其余变灰不可点。
//   数据：{ multi:false, hint:'', items:[{label, value}] }
function renderOptions(o) {
  const wrap = document.createElement('div');
  wrap.className = 'optwrap';
  if (o.hint) { const h = document.createElement('div'); h.className = 'opthint'; h.textContent = o.hint; wrap.appendChild(h); }
  const btns = [];
  const picked = new Set();
  const KEYS = 'ABCDEFGH';
  let commitBtn = null;   // ⚠️ 必须在下面 forEach 之前声明（否则点多选项时 TDZ 报错）
  function settle() {
    const vals = o.items.filter((_, i) => picked.has(i)).map((x) => x.value != null ? x.value : x.label);
    btns.forEach((b, i) => {
      b.disabled = true;
      b.classList.toggle('picked', picked.has(i));
      b.classList.toggle('notpicked', !picked.has(i));
      const k = b.querySelector('.k');
      if (k) k.textContent = picked.has(i) ? '✓' : KEYS[i] || '';
    });
    const val = o.multi ? vals.join(' + ') : (vals[0] || '');
    bubble('me', val);
    toast('已选择：' + val);
  }
  o.items.forEach((it, i) => {
    const b = document.createElement('button');
    const k = document.createElement('span'); k.className = 'k'; k.textContent = KEYS[i] || '';
    const t = document.createElement('span'); t.textContent = String(it.label);
    b.appendChild(k); b.appendChild(t);
    b.onclick = () => {
      if (!o.multi) { picked.clear(); picked.add(i); settle(); return; }
      if (picked.has(i)) picked.delete(i); else picked.add(i);
      btns.forEach((x, j) => {
        x.classList.toggle('picked', picked.has(j));
        const kk = x.querySelector('.k'); if (kk) kk.textContent = picked.has(j) ? '✓' : (KEYS[j] || '');
      });
      if (o.multi && o.commitLabel) commitBtn.textContent = o.commitLabel + '（已选 ' + picked.size + '）';
    };
    btns.push(b);
    wrap.appendChild(b);
  });
  if (o.multi) {
    commitBtn = document.createElement('button');
    commitBtn.textContent = o.commitLabel || '就这些';
    commitBtn.style.cssText = 'justify-content:center;font-weight:600';
    commitBtn.onclick = () => { if (picked.size) settle(); };
    wrap.appendChild(commitBtn);
  }
  return wrap;
}

/** 逐字流追加：把增量拼到原文上，然后**重画这段 Markdown**。
 *  为什么不直接 append 文字：正文里会有 `**`、`|` 表格、``` 代码块 ——
 *  只有整段重新解析才能边流边渲染成最终的样子（跟 dsh 网页一个感觉）。
 *  代价是每来一个字要重画一次，所以下面按 60ms 节流；收尾那一下强制重画。 */
function bubbleAppend(el, text) {
  if (!el) return;
  setMsgText(el, (el._raw || '') + text, false);
}

/** 收尾：用权威全文替换掉增量拼出来的内容（强制重画，不受节流影响） */
function bubbleSet(el, text) {
  if (!el) return;
  el._done = true;
  setMsgText(el, text, true);
  el.classList.remove('streaming');
  if (el._mk === 'reasoning' || el._mk === 'tool') setFoldText(el, text);
  else autoWebCards(el, text);   // ⭐ replace 也是定稿：扫一次 URL
}

// ---------- ⭐ Markdown 渲染（2026-09-17）----------
// 用户要"跟 dsh 一样"：正文得是渲染过的文档，不是一串 `**` 和 `|`。
// 自己写个够用的子集，**不引外部库**（手机走 Tailscale，离线也得能看）。
// ⚠️ 安全：**先转义再解析**，源码里的 HTML 一律变实体；后面插进去的标签全是我们自己写的。
function inlineMd(s) {
  // ⭐ 2026-09-19：行内代码 `` `...` `` **先摘出来保护**，再对代码外的部分做粗体/斜体/链接。
  //   ⚠️ 原来是一条链一路 replace：`` `a ** b ** c` `` 会被后面的粗体规则吃掉 `**`。
  return String(s).split(/(`[^`\n]+`)/g).map((p) => {
    if (p.length >= 2 && p[0] === '`' && p[p.length - 1] === '`') return '<code>' + p.slice(1, -1) + '</code>';
    return p
      .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
      .replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<i>$2</i>')
      .replace(/\[([^\]\n]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  }).join('');
}

// ⭐ 2026-09-19：这些"语言标注"其实不是代码，是用户手写排版 ⇒ **块内也渲染 Markdown**。
//   任何**真语言**（js / python / bash / json / …）不在名单里 ⇒ 保持原样（`a ** b` 的星号不能被吃）。
const RENDER_AS_MD_LANGS = { '': 1, text: 1, txt: 1, md: 1, markdown: 1 };

function mdToHtml(src) {
  return mdToHtmlEscaped(escapeHtml(String(src || '')));
}

// ⭐ 2026-09-19：**已转义过**的文本走这里（代码块内渲染 Markdown 时复用，避免二次转义）。
//   ⚠️ 别在外面再 escapeHtml 一次 —— `&` 会变 `&amp;amp;`。
function mdToHtmlEscaped(escaped) {
  const lines = String(escaped || '').split('\n');
  const out = [];
  const para = [];
  const flush = () => {
    if (!para.length) return;
    out.push('<p>' + inlineMd(para.join('\n')).replace(/\n/g, '<br>') + '</p>');
    para.length = 0;
  };
  let i = 0;
  while (i < lines.length) {
    const ln = lines[i];

    let m = /^\s*(```|~~~)(.*)$/.exec(ln);          // 代码块
    if (m) {
      flush();
      const fence = m[1], lang = m[2].trim(), code = [];
      i++;
      while (i < lines.length && lines[i].indexOf(fence) !== 0) { code.push(lines[i]); i++; }
      i++;
      // ⭐ 2026-09-19 按【语言标注】区分（用户：「那代码块里也渲染吧，全是星号有点难读」）：
      //   · 无语言 / text / txt / md / markdown ⇒ 当 Markdown 排版渲染（粗体/斜体/链接/行内码）
      //   · 真语言（js/python/bash/json/…）⇒ 一字不动 —— 否则 `a ** b` 的星号会被粗体规则吃掉
      //   ⚠️ 渲染时**保留"块"的外观**（`.mdblock`）—— 用户看后马上说「代码块直接没了」，
      //      他要的是"块还在、里面的星号没了"，不是把它拆成普通段落。
      if (RENDER_AS_MD_LANGS[lang.toLowerCase()]) out.push('<div class="mdblock">' + mdToHtmlEscaped(code.join('\n')) + '</div>');
      else out.push('<pre><code' + (lang ? ' data-lang="' + lang + '"' : '') + '>' + code.join('\n') + '</code></pre>');
      continue;
    }

    if (/^\s*\|.*\|\s*$/.test(ln) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      flush();                                       // 表格
      const head = ln.split('|').slice(1, -1).map((s) => s.trim());
      i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
        rows.push(lines[i].split('|').slice(1, -1).map((s) => s.trim()));
        i++;
      }
      out.push('<table><thead><tr>' + head.map((h) => '<th>' + inlineMd(h) + '</th>').join('') +
        '</tr></thead><tbody>' +
        rows.map((r) => '<tr>' + r.map((c) => '<td>' + inlineMd(c) + '</td>').join('') + '</tr>').join('') +
        '</tbody></table>');
      continue;
    }

    m = /^(#{1,6})\s+(.*)$/.exec(ln);                // 标题
    if (m) {
      flush();
      const lv = Math.min(6, m[1].length) + 1;       // # → h2（h1 留给页面标题）
      out.push('<h' + lv + '>' + inlineMd(m[2]) + '</h' + lv + '>');
      i++;
      continue;
    }

    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(ln)) { flush(); out.push('<hr>'); i++; continue; }

    if (/^\s*&gt;\s?/.test(ln)) {                    // 引用（注意：已转义，> 变成 &gt;）
      flush();
      const q = [];
      while (i < lines.length && /^\s*&gt;\s?/.test(lines[i])) { q.push(lines[i].replace(/^\s*&gt;\s?/, '')); i++; }
      out.push('<blockquote>' + inlineMd(q.join('\n')).replace(/\n/g, '<br>') + '</blockquote>');
      continue;
    }

    if (/^\s*([-*+]|\d+[.)])\s+/.test(ln)) {          // 列表
      flush();
      const ordered = /^\s*\d+[.)]\s+/.test(ln), items = [];
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/, ''));
        i++;
      }
      const tag = ordered ? 'ol' : 'ul';
      out.push('<' + tag + '>' + items.map((x) => '<li>' + inlineMd(x) + '</li>').join('') + '</' + tag + '>');
      continue;
    }

    if (!ln.trim()) { flush(); i++; continue; }
    para.push(ln); i++;
  }
  flush();
  return out.join('');
}

/** 折叠块（思考 / 工具）：标题实时更新，正文放原文。
 *  思考块的标题显示"思考中 · N 字"，流完了变成"思考 · N 字" —— 一眼看出我还在不在想。 */
function setFoldText(el, raw) {
  if (!el || !el._sum) return;
  const s = String(raw || '');
  if (el._mk === 'reasoning') {
    const n = [...s].length;
    el._sum.textContent = (el._done ? '思考' : '思考中') + ' · ' + n.toLocaleString() + ' 字';
    renderFoldBody(el, s);
    return;
  }
  // 工具：上面一行是短摘要，展开看到的是**完整命令 / 完整参数**（+ 看图时把图也放进来）。
  // 用户 10:11：「工具调用以前总结成一句短句也是因为不能折叠，现在能折叠了，你也完整发出来吧」
  el._sum.textContent = s || '工具';
  renderFoldBody(el, el._detail || s);
}

/** 折叠块的正文。★ 有图就先放图 —— 用户 10:47：
 *  「你看图的时候…我想打开一起看看！所以发过来，放在那个折叠里」 */
function renderFoldBody(el, text) {
  const fb = el._fb;
  if (!fb) return;
  fb.textContent = '';
  if (el._foldImg) {
    const img = document.createElement('img');
    img.className = 'foldimg';
    img.src = API + el._foldImg;
    img.loading = 'lazy';
    fb.appendChild(img);
  }
  const d = document.createElement('div');
  d.textContent = text || '';
  fb.appendChild(d);
}

/** 把一段原文渲染进气泡。force=true 时不受节流限制（收尾用）。 */
function setMsgText(el, raw, force) {
  el._raw = raw;
  if (el._mk === 'reasoning' || el._mk === 'tool') { setFoldText(el, raw); return; }
  const t = el.querySelector('.txt');
  if (!t) return;
  if (el.dataset.kind === 'pc') {
    const now = Date.now();
    if (!force && now - (el._lr || 0) < 60) return;   // 节流：最多 ~16 次/秒
    el._lr = now;
    t.innerHTML = mdToHtml(raw);
  } else {
    t.textContent = raw;                              // 用户自己发的原样显示
  }
  const body = $('chBody');
  stickToBottom();
}

function syncOverlayLock() {
  const on = !!document.querySelector('#loc.show');
  document.documentElement.classList.toggle('overlay-open', on);
}

// 开源版：主页就是唯一页面（不再有会话页/抽屉）
function openHome() { try { window.scrollTo(0, 0); } catch (e) {} }
function closeHome() {}
function closeHomeNow() {}

// 手机返回键：APK 映射成 WebView goBack ⇒ 触发 popstate。
let suppressPop = false;
window.addEventListener('popstate', function () {

  const dlg = $('mask');
  if (dlg && dlg.classList.contains('show')) { closeDlg(); return; }

// ★★ 2026-09-17 用户要的：**滚动锚点** —— 我生成的时候他往上滑，不该被拽回底部。
//   病根：`bubble()` / `setMsgText()` 里三处 `body.scrollTop = body.scrollHeight`
//         全是**无条件**滚到底 ⇒ 只要我来新字，他正在看的地方就被拽走。
//   做法：**贴底才跟随** —— 离底 ≤ 48px 才算"贴着底"；他往上滑了就不动他的视口。
//   ⚠️ 9/12 在小窗上踩过同源的坑（视角抖动/锚点漂失）；这次的结论是
//      "不必做复杂的锚点补偿 —— 不跟随就是不跟随，最简单也最不会错"。
const STICK_TOL = 48;

// ══════════════════════════════════════════════════════════════════════
// ★★ 2026-09-18 **重做**：粘底滚动（dsh + op 共用同一套实现）
//   原型：9/17 那版 `stickBottom + lastSelfScroll(250ms) + MutationObserver`
//   （记于早期版本；现在的实现见下面 makeSticky）
//
//   🔴 原型两个真 bug（今天探针实测复现）：
//     ① **250ms 时间窗判断"自己滚的"** —— 流式生成时 `setMsgText()` 每 60ms 就滚一次，
//        等于时间窗**永远处在刚滚过的状态** ⇒ 用户往上滑的那一下被当成"自己滚的"跳过
//        ⇒ `stick` 一直是 true ⇒ 下一个字就把他拽回底部。（"生成的时候照样被往下拉"）
//     ② **删顶部老消息（>60 条）** 触发 Chrome 的滚动锚定（scroll anchoring）
//        ⇒ 探针实测：滚到 400px，来一条新消息，scrollTop 直接被打到 **0**（跳回顶部）。
//
//   ✅ 重做后的两条关键差别：
//     ① 不再用时间窗 —— 改成**比对"我上次设置的目标位置"**（`lastSetTop`）。
//        自己滚的那一下 scrollTop 必然等于 lastSetTop（读回的是被 clamp 后的真实值），
//        只跳过"恰好等于"的那一次，**其余任何滚动都老老实实更新 stick**。
//     ② `overflow-anchor:none`（CSS）+ **删节点时补偿高度**（`trim()`），
//        视口不会因为顶部内容消失而跳。
// ══════════════════════════════════════════════════════════════════════
function makeSticky(getEl, tol) {
  // ★★ 2026-09-18 第二版（用户定的语义）：
  //   「我在最底下的时候，他就继续生成往上滚；**我往上拉就立马取消跟随**」
  //   三个改动（针对"代码块流式时往上拉被强行弹下来 + 抖动"）：
  //     ① 上滑**哪怕 1px** 就停手 —— 不再拿 48px 容差当"继续跟随"的依据
  //     ② 补帧从"连续每帧滚 1.2 秒"改成**定次数**（0/50/150/350/700ms），
  //        每次先过"别抢"的闸 —— 原来每帧都滚，小幅上滑马上被拽回 ⇒ 弹下来+抖
  //     ③ 「阅读锁」：非粘底时盯住**视口里第一条可见消息**，DOM 一变就补回同样位移
  //        （插入/删除/代码块撑高都不动他正在看的那一行）
  const S = { stick: true, lastSetTop: -1, lastHeight: -1, bound: false, userTouched: false, userUntil: 0, selfTop: -1, selfAt: 0 };
  function el() { try { return getEl(); } catch (e) { return null; } }
  function atBottom(t) {
    const e = el(); if (!e) return true;
    return e.scrollHeight - e.scrollTop - e.clientHeight <= (t == null ? (tol || 48) : t);
  }
  function onScroll() {
    const e = el(); if (!e) return;
    // ★★★ 2026-09-18 第四版（用户定的**最简规则**）：
    //   「我在最底下（≈1px）就自动往下滚；我只要往上滑，就立马停止跟随。」
    //   判据只有两条，且**只对真实用户输入生效**（`userUntil` = 输入后 800ms 窗口）：
    //     · 滚到"极底"（2px 内）⇒ 跟随
    //     · 只要没到极底（= 往上滑了哪怕 1px）⇒ 立刻停
    //   ⚠️ 不再用"和上次设的值比"来猜是不是用户滚的 —— 前两版就栽在这：
    //     发消息时 force() 被自己的闸当成"你在上翻"挡掉 ⇒ **屏幕不动**。
    //     程序滚动/内容长高的 scroll 事件**没有输入窗口** ⇒ 一律不参与判断。
    //   ⚠️ 还有一道保险：**我自己滚的那一下**（发消息/补帧）会带 `selfTop` 标记，
    //      哪怕你的手指还在屏幕上，也不会被误当成"你没到底"而停手。
    //   ⚠️ 标记只认 250ms 内的（否则上一次程序滚动的标记会残留，把你"滚回底部"那一下吞掉
    //      ⇒ 表现就是"回到最下面了但跟随不恢复"）
    if (S.selfTop >= 0 && Date.now() - S.selfAt < 250 && Math.abs(e.scrollTop - S.selfTop) <= 2) { S.selfTop = -1; return; }
    if (S.selfTop >= 0 && Date.now() - S.selfAt >= 250) S.selfTop = -1;
    if (Date.now() > S.userUntil) return;
    if (atBottom(2)) { if (!S.stick) S.stick = true; lockSample(); return; }
    S.stick = false;
    lockSample();
  }
  function scroll() {
    const e = el(); if (!e || !S.stick) return;
    e.scrollTop = e.scrollHeight;
    S.selfTop = e.scrollTop; S.selfAt = Date.now();   // ★ 标记"这一下是我滚的"
    S.lastSetTop = e.scrollTop;            // 读回真实值（浏览器会把 scrollTop 夹到最大值）
    S.lastHeight = e.scrollHeight;
    requestAnimationFrame(function () {
      if (!S.stick) return;
      const e2 = el(); if (!e2) return;
      e2.scrollTop = e2.scrollHeight;
      S.selfTop = e2.scrollTop; S.selfAt = Date.now();   // ★ 同上
      S.lastSetTop = e2.scrollTop;
      S.lastHeight = e2.scrollHeight;
    });
  }
  function force() { S.stick = true; scroll(); }
  // ★★ 2026-09-18 首屏硬贴底：`force()` 只把 stick 置真，可 `scroll()` 里还有"别抢"的闸 ——
  //   首屏渲染时 `lastSetTop` 往往先被设成一个小值，之后 scrollTop 比它小 ⇒
  //   `userMovedUp()` 误判成"用户上滑" ⇒ force 被自己的闸挡掉，人就停在顶上。
  //   ⇒ hardForce：先把锚点记账清空（lastSetTop=-1，userMovedUp 必为 false）再滚，绝对到底。
  function hardForce() { S.stick = true; S.lastSetTop = -1; S.lastHeight = -1; scroll(); }
  // ★★ 2026-09-18 首屏补底（用户：「一刷新就在当前聊天位置」）：
  //   手机 WebView 比无头 Chrome 慢，hardForce 之后内容还在长高（图片 / 字体 / 折叠块），
  //   中途一旦被 `userMovedUp` 误判 ⇒ stick 掉了，人就停在"差最后一截"的地方。
  //   ⇒ 首屏这几秒多补几帧（定次数，不占 rAF）；**只要用户真的动了手就立刻停**。
  function bootBottom() {
    S.userTouched = false;
    [0, 250, 600, 1200, 2200, 3500].forEach(function (d) {
      setTimeout(function () { if (!S.userTouched) hardForce(); }, d);
    });
  }
  // ★ 「再贴一会儿」：改成**定次数**补帧（0/50/150/350/700ms），不连续占着 rAF
  let settleBusy = false;
  function settle() {
    if (!S.stick || settleBusy) return;
    settleBusy = true;
    const delays = [0, 60, 180, 400, 800, 1500, 2500];
    delays.forEach(function (d, i) {
      setTimeout(function () {
        if (i === delays.length - 1) settleBusy = false;
        if (!S.stick) return;
        scroll();
      }, d);
    });
  }
  // ★ 阅读锁：他不在底部（正在看历史）时，保证"视口里那一条"不动
  let lockEl = null, lockTop = 0;
  function lockSample() {
    const e = el();
    if (!e || S.stick) { lockEl = null; return; }
    let cand = null;
    for (const c of e.children) { const r = c.getBoundingClientRect(); if (r.bottom > 2) { cand = c; break; } }
    if (!cand) { lockEl = null; return; }
    lockEl = cand; lockTop = cand.getBoundingClientRect().top;
  }
  function lockApply() {
    const e = el();
    if (!e || S.stick || !lockEl || !lockEl.isConnected) { lockSample(); return; }
    const top = lockEl.getBoundingClientRect().top;
    const d = top - lockTop;
    if (Math.abs(d) >= 1) {
      e.scrollTop += d;                    // 把它挪回原来的屏幕位置
      S.selfTop = e.scrollTop; S.selfAt = Date.now();   // ★ 我们主动补偿的，标记掉
      S.lastSetTop = e.scrollTop;
      lockTop = lockEl.getBoundingClientRect().top;
    }
  }
  function bind() {
    const e = el(); if (!e || S.bound) return;
    S.bound = true;
    e.addEventListener('scroll', onScroll, { passive: true });
    // ★★ 2026-09-18：**只有真实用户交互**才允许"取消跟随" ——
    //   布局/图片/字体引起的滚动位置变化不算用户操作（首屏补底靠这条兜底）。
    ['wheel', 'touchstart', 'touchmove', 'pointerdown', 'keydown'].forEach(function (t) {
      e.addEventListener(t, function () { S.userTouched = true; S.userUntil = Date.now() + 800; }, { passive: true });
    });
    // 图片 load / 折叠块 toggle **不冒泡**，但**捕获阶段**能收到
    e.addEventListener('load', function () { settle(); }, true);
    e.addEventListener('toggle', function () { lockApply(); settle(); }, true);
    if (typeof MutationObserver !== 'undefined') {
      new MutationObserver(function () { lockApply(); settle(); })
        .observe(e, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['open'] });
    }
  }
  // 删顶部老消息。两条保险：
  //   ① **贴底时才按 max 删**；他正在看历史（非粘底）就放宽到 hardMax，
  //      绝不删掉他正在读的那条（原来固定 60 条 ⇒ 看到一半内容被删是常态）
  //   ② 非粘底时补偿掉删掉的高度，视口不跳
  function trim(max, hardMax) {
    const e = el(); if (!e) return;
    const cap = S.stick ? max : Math.max(max, hardMax || 200);
    while (e.children.length > cap) {
      const first = e.firstChild;
      const h = first.offsetHeight || 0;
      const wasStick = S.stick;
      e.removeChild(first);
      if (!wasStick && h) {
        e.scrollTop = Math.max(0, e.scrollTop - h);
        S.selfTop = e.scrollTop; S.selfAt = Date.now();   // ★ 补偿也是我们干的
        S.lastSetTop = e.scrollTop;
        S.lastHeight = e.scrollHeight;
      }
    }
    lockSample();   // ★ 刚改过布局 ⇒ 重新采一次阅读锁基准（免得 lockApply 二次补偿）
  }
  return { S: S, el: el, atBottom: atBottom, scroll: scroll, force: force, hardForce: hardForce, bootBottom: bootBottom, bind: bind, trim: trim, settle: settle, lockSample: lockSample };
}
const dshScroll = makeSticky(() => $('chBody'), STICK_TOL);
function stickToBottom(force) {
  if (force) dshScroll.force();
  else dshScroll.scroll();
}
function isNearBottom(el) { return dshScroll.atBottom(); }   // 兼容老引用
// ★★ 光靠"append 之后滚一次"不够：**内容在滚动之后还会长高**
//   （「生成中…」那行显出来、折叠块展开、图片加载、字体换行……），实测每次都差 127px 到不了底。
//   ⇒ 挂一个 ResizeObserver：**只要内容长高、而且他贴着底，就再贴一次**。

//   ⇒ 检测到服务端页面换新版时**不再 location.reload()**，改成给刷新键 #chReload 挂 .hasnew 红点；
//     要不要刷由用户自己按 ⟳ 决定（按 ⟳ 照旧 reload，重载后红点自然消失）。

function markNewVersion() {
  try {
    const b = document.getElementById('chReload');
    if (b) b.classList.add('hasnew');
  } catch (e) {}
}
function connectSSE() {
  if (es) { try { es.close(); } catch (e) {} es = null; }
  try { es = new EventSource(API + '/api/events'); } catch (e) { return; }
  es.onopen = () => { inboxSince = 0; pullInbox(); };
  es.onmessage = (ev) => {
    let d; try { d = JSON.parse(ev.data); } catch (e) { return; }
    if (d.type === 'hello' || d.type === 'ping') {
      if (d.version && MY_VER && MY_VER !== VER_SENTINEL && d.version !== MY_VER) markNewVersion();
      return;
    }
    if (d.type === 'new' && d.msg) {
      const m = d.msg;
      if (m.from === 'phone') return;
      if (m.kind === 'result') return;      // 指令结果不进消息流
      if (rendered.has(m.id)) return;
      rendered.add(m.id);
      if (m.ts > inboxSince) inboxSince = m.ts;
      bubble('pc', m.text, m.image, m.buttons, m.kind, m.detail, m.detailImage, false, m.file, m.options, null, m.web);
    }
  };
  es.onerror = () => { /* EventSource 自动重连 */ };
}

async function pullInbox() {
  try {
    const r = await fetch(API + '/api/inbox?since=' + inboxSince, { cache: 'no-store' });
    const j = await r.json();
    (j.messages || []).forEach((m) => {
      if (m.ts > inboxSince) inboxSince = m.ts;
      if (m.from === 'phone') return;      // 自己发的已经本地画过
      if (m.kind === 'result') return;
      if (rendered.has(m.id)) return;      // SSE 已经画过的不重复画
      rendered.add(m.id);
      bubble('pc', m.text, m.image, m.buttons, m.kind, m.detail, m.detailImage, false, m.file, m.options, null, m.web);
    });
  } catch (e) { /* 断网忽略 */ }
}

async function uploadFiles(files) {

      const r = await fetch(API + '/api/upload', { method: 'POST', body: fd });
      const j = await r.json();
      if (!j.ok) { bubble('sys', '✗ 上传失败：' + (j.error || '未知')); continue; }
      const imgUrl = j.url || ('/uploads/' + j.name);
